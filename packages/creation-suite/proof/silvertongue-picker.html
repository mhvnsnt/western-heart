<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Silvertongue — Creation Suite Picker</title>
<style>
  :root { --bg:#14141a; --card:#1e1e28; --accent:#e8b64c; --txt:#f2f2f5; --dim:#9a9aa8; }
  * { box-sizing:border-box; -webkit-tap-highlight-color: transparent; }
  body { margin:0; background:var(--bg); color:var(--txt);
         font-family:-apple-system, "Segoe UI", Roboto, sans-serif; }
  .phone { max-width:480px; margin:0 auto; min-height:100vh; display:flex; flex-direction:column; }
  header { padding:14px 16px 8px; border-bottom:1px solid #2a2a36; }
  header h1 { font-size:19px; margin:0; letter-spacing:.5px; }
  header p { margin:4px 0 0; color:var(--dim); font-size:12.5px; }
  .preview { position:relative; background:#fff; }
  .preview img { display:block; width:100%; height:auto; }
  .slotbar { display:flex; gap:8px; padding:10px 16px; overflow-x:auto; background:var(--card); }
  .slot { flex:0 0 auto; border:1px solid #3a3a4a; border-radius:10px; padding:8px 10px;
          font-size:12px; color:var(--dim); background:#17171f; min-width:86px; text-align:center; }
  .slot.armed { border-color:var(--accent); color:var(--accent); }
  .slot .v { display:block; color:var(--txt); font-size:11px; margin-top:3px; min-height:14px; }
  .tabs { display:flex; gap:6px; padding:12px 16px 4px; overflow-x:auto; }
  .tab { flex:0 0 auto; padding:9px 14px; border-radius:999px; border:1px solid #3a3a4a;
         background:#17171f; color:var(--txt); font-size:13.5px; }
  .tab.on { background:var(--accent); border-color:var(--accent); color:#14141a; font-weight:700; }
  .grid { display:grid; grid-template-columns:1fr 1fr; gap:10px; padding:10px 16px 90px; }
  .opt { border:2px solid #33333f; border-radius:12px; background:var(--card); overflow:hidden;
         padding:0; color:var(--txt); text-align:left; }
  .opt img { display:block; width:100%; height:120px; object-fit:cover; background:#0e0e13; }
  .opt .nm { padding:8px 10px 2px; font-size:13.5px; font-weight:600; }
  .opt .ds { padding:0 10px 10px; font-size:11.5px; color:var(--dim); }
  .opt.picked { border-color:var(--accent); }
  .opt .tag { display:inline-block; font-size:10px; color:#14141a; background:var(--accent);
              border-radius:6px; padding:2px 6px; margin:6px 10px 0; font-weight:700; }
  .dock { position:fixed; bottom:0; left:0; right:0; background:#101016;
          border-top:1px solid #2a2a36; padding:10px 16px calc(10px + env(safe-area-inset-bottom)); }
  .dock .row { max-width:480px; margin:0 auto; display:flex; gap:10px; }
  #assignBtn { flex:1; padding:15px; font-size:16px; font-weight:700; border:0; border-radius:12px;
               background:var(--accent); color:#14141a; }
  #assignBtn:disabled { background:#33333f; color:#77778a; }
  #status { max-width:480px; margin:6px auto 0; font-size:12px; color:var(--dim); min-height:16px; }
  .hint { padding:8px 16px; font-size:12px; color:var(--dim); }
</style>
</head>
<body>
<div class="phone">
  <header>
    <h1>SILVERTONGUE — Default Attire</h1>
    <p>Creation Suite &middot; tap an option, then tap ASSIGN &middot; no drag-and-drop</p>
  </header>
  <div class="preview"><img id="previewImg" src="preview.png" alt="Silvertongue preview"></div>
  <div class="hint" id="hint">1 &middot; Tap an option below to preview it.</div>
  <div class="slotbar" id="slotbar"></div>
  <div class="tabs" id="tabs"></div>
  <div class="grid" id="grid"></div>
  <div class="dock">
    <div class="row"><button id="assignBtn" disabled>ASSIGN TO SLOT</button></div>
    <div id="status"></div>
  </div>
</div>
<script>
const DATA = {
  slots: [
    {id:"eye",   label:"Eyes"},
    {id:"hair",  label:"Hair"},
    {id:"face",  label:"Face"},
    {id:"outfit",label:"Outfit"},
  ],
  tabs: [
    {id:"eye", label:"Eyes"}, {id:"hair", label:"Hair"},
    {id:"face", label:"Face"}, {id:"outfit", label:"Outfit"},
  ],
  options: [
    {id:"eye-yellow-tiger", tab:"eye", slot:"eye", name:"Yellow tiger",
     desc:"Owner's 'I like' variant — amber iris, limbal ring.", img:"opt_eye_yellow.png", def:true},
    {id:"eye-original-bluegray", tab:"eye", slot:"eye", name:"Original blue-gray",
     desc:"Game-original eye, saved as swap option.", img:"opt_eye_blue.png"},
    {id:"hair-spy-sleek", tab:"hair", slot:"hair", name:"Spy sleek (no drills)",
     desc:"Drill rolls removed — new silhouette.", img:"opt_hair_spy.png", def:true},
    {id:"hair-original-drills", tab:"hair", slot:"hair", name:"Original drills",
     desc:"Blonde drill curls, saved as swap option.", img:"opt_hair_drills.png"},
    {id:"face-007-makeup", tab:"face", slot:"face", name:"007 makeup",
     desc:"Smoky eye, winged liner, beauty mark.", img:"opt_face_007.png", def:true},
    {id:"face-original", tab:"face", slot:"face", name:"Original face",
     desc:"Game-original face texture, saved.", img:"opt_face_orig.png"},
    {id:"outfit-spy-debut", tab:"outfit", slot:"outfit", name:"Spy debut (black)",
     desc:"Black leather spy suit — Slot 1 default.", img:"opt_outfit_spy.png", def:true},
    {id:"outfit-noir-gala", tab:"outfit", slot:"outfit", name:"Noir Gala",
     desc:"Black/red formal — later slot.", img:"opt_outfit_noir.png"},
  ]
};
const assigned = {};
DATA.options.forEach(o => { if (o.def) assigned[o.slot] = o.id; });
let picked = null, curTab = "eye";

const $ = s => document.querySelector(s);
function renderSlots(){
  $("#slotbar").innerHTML = DATA.slots.map(s => {
    const a = DATA.options.find(o => o.id === assigned[s.id]);
    return `<div class="slot${picked && picked.slot===s.id ? ' armed':''}">
      ${s.label}<span class="v">${a ? a.name : '—'}</span></div>`;
  }).join("");
}
function renderTabs(){
  $("#tabs").innerHTML = DATA.tabs.map(t =>
    `<button class="tab${t.id===curTab?' on':''}" data-tab="${t.id}">${t.label}</button>`).join("");
  document.querySelectorAll(".tab").forEach(b => b.onclick = () => {
    curTab = b.dataset.tab; picked = null; renderTabs(); renderGrid(); renderSlots(); syncBtn();
    $("#hint").textContent = "1 · Tap an option below to preview it.";
  });
}
function renderGrid(){
  $("#grid").innerHTML = DATA.options.filter(o => o.tab===curTab).map(o =>
    `<button class="opt${picked && picked.id===o.id ? ' picked':''}${assigned[o.slot]===o.id?'':''}" data-id="${o.id}">
      ${assigned[o.slot]===o.id?'<span class="tag">ASSIGNED</span>':''}
      <img src="${o.img}" alt="${o.name}" loading="lazy">
      <div class="nm">${o.name}</div><div class="ds">${o.desc}</div>
    </button>`).join("");
  document.querySelectorAll(".opt").forEach(b => b.onclick = () => {
    picked = DATA.options.find(o => o.id === b.dataset.id);
    renderGrid(); renderSlots(); syncBtn();
    $("#hint").textContent = `2 · Tap ASSIGN TO SLOT to put "${picked.name}" on ${picked.slot}.`;
  });
}
function syncBtn(){
  const btn = $("#assignBtn");
  if (!picked) { btn.disabled = true; btn.textContent = "ASSIGN TO SLOT"; return; }
  btn.disabled = false;
  btn.textContent = `ASSIGN "${picked.name.toUpperCase()}" → ${picked.slot.toUpperCase()}`;
}
$("#assignBtn").onclick = () => {
  if (!picked) return;
  assigned[picked.slot] = picked.id;
  $("#status").textContent = `Assigned "${picked.name}" to ${picked.slot} slot. Nothing overwritten — originals kept as options.`;
  const done = picked; picked = null;
  renderGrid(); renderSlots(); syncBtn();
  $("#hint").textContent = "1 · Tap an option below to preview it.";
};
renderSlots(); renderTabs(); renderGrid(); syncBtn();
</script>
</body>
</html>
