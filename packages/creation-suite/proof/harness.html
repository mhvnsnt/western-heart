<!doctype html><html><body style="margin:0;background:#1b1b22">
<script type="importmap">{"imports":{"three":"./three/build/three.module.js","three/addons/":"./three/examples/jsm/"}}</script>
<canvas id="c" width="2000" height="760"></canvas>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { measureGirth } from './cs/src/body.js'; window.__mg=measureGirth;
import { makeDNA, applyDNA, attach, findSkinned } from './cs/src/index.js';
const W=2000,H=760, N=5, r=new THREE.WebGLRenderer({canvas:document.getElementById('c'),antialias:true,preserveDrawingBuffer:true});
r.setSize(W,H,false); r.setScissorTest(true);
const L=new GLTFLoader(); const load=u=>new Promise((a,b)=>L.load(u,g=>a(g.scene),undefined,b));
const report={};
function scene(){const s=new THREE.Scene();s.background=new THREE.Color(0x24242e);s.add(new THREE.HemisphereLight(0xffffff,0x334,1.6));const d=new THREE.DirectionalLight(0xffffff,2.2);d.position.set(2,4,3);s.add(d);const g=new THREE.Mesh(new THREE.CircleGeometry(1.2,40),new THREE.MeshStandardMaterial({color:0x3a3a48}));g.rotation.x=-Math.PI/2;s.add(g);return s;}
const cfgs=[['default',{}],['heavy',{}],['femaleCurvy',{}],['heavy',{jig:true}]];
const panels=[];
for(const [bt,o] of cfgs){
  const s=scene(), m=await load('pantera_leoman.glb'); s.add(m);
  const dna=makeDNA({name:bt,bodyType:bt, attire: bt==='femaleCurvy'?{face:{id:'bannon_mask'}}:{}});
  const sys=applyDNA(m,dna); const _sm=findSkinned(m)[0]; report[bt+'_girth']=Object.fromEntries(Object.keys(_sm.userData.cs.frames).map(k=>[k,+(window.__mg(_sm,k)).toFixed(3)]));
  report[bt+(o.jig?'_jiggle':'')]={sliders:dna.sliders,springs:sys.springs.map(x=>({n:x.name,girth:+x.girth.toFixed(3),k:+x.stiffness.toFixed(0),mass:+x.mass.toFixed(2)}))};
  if(bt==='femaleCurvy'){const mask=await load('bannon_mask.glb'); mask.rotation.y=-Math.PI/2; const sk=findSkinned(m)[0]; const b=new THREE.Box3().setFromObject(m); const h=b.max.y-b.min.y; attach(m,'face',mask,{fit:{headHeight:h*0.14,offset:[0,h*0.01,h*0.075]},edit:{tint:'#ff4a3a'}});}
  const box=new THREE.Box3().setFromObject(m), c=box.getCenter(new THREE.Vector3()), hh=box.max.y-box.min.y;
  const cam=new THREE.PerspectiveCamera(30,(W/N)/H,0.05,50);
  const ang = o.jig ? Math.PI*0.5 : 0.75; cam.position.set(c.x+hh*2.6*Math.sin(ang), c.y+hh*0.05, c.z+hh*2.6*Math.cos(ang)); cam.lookAt(c);
  panels.push({s,m,cam,sys,o,hips:findSkinned(m)[0].skeleton.bones.find(b=>b.name==='Hips')});
}
panels.forEach((p,i)=>{r.setViewport(i*W/N,0,W/N,H);r.setScissor(i*W/N,0,W/N,H);r.render(p.s,p.cam);});
// jiggle: drop the hips 6cm over 1 frame and recover -> capture peak belly offset
const P=panels[3]; const y0=P.hips.position.y; let peak=0, peakT=0, t=0, dt=1/60, trace=[];
for(let i=0;i<90;i++){t=i*dt; P.hips.position.y = y0 + (i>=10&&i<16? -0.06/ (P.hips.parent?P.hips.parent.getWorldScale(new THREE.Vector3()).y:1):0) ;
  P.m.updateMatrixWorld(true); P.sys.update(dt);
  const b=P.sys.springs.find(s=>s.name==='belly'); const off=b?b.offset.length():0; trace.push(+off.toFixed(4));
    if(off>peak){peak=off;peakT=i;} if(i===19) break; }
report.jiggleTrace=trace; report.peakBellyOffset_m=peak;
// markers for spring bones
for(const s of P.sys.springs){const g=new THREE.Mesh(new THREE.SphereGeometry(0.018),new THREE.MeshBasicMaterial({color:0xff2222,depthTest:false}));g.renderOrder=9;s.bone.add(g);}
r.setViewport(4*W/N,0,W/N,H);r.setScissor(4*W/N,0,W/N,H);r.render(P.s,P.cam);
window.REPORT=report; document.title='DONE';
</script></body></html>
