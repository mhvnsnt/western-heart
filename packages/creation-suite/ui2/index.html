<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Creation Suite — Western Heart</title>
<link rel="stylesheet" href="./suite2.css" />
<script type="importmap">
{
  "imports": {
    "three": "../../../game/vendor/three.module.js",
    "three/addons/": "../../../game/vendor/addons/"
  }
}
</script>
</head>
<body data-screen="entry">
  <!-- The stage is the foundation: the fighter is ALWAYS on screen.
       Every menu is a partial overlay drilled over this view. -->
  <canvas id="stage3d" aria-label="Fighter preview"></canvas>
  <div id="stageShade" aria-hidden="true"></div>

  <!-- Top plate: fighter + attire-slot context (Tekken entry rule:
       fighter first, slot second, items third). -->
  <header id="topPlate">
    <div class="plate-main">
      <span id="plateName">—</span>
      <span id="plateMeta">loading…</span>
    </div>
    <div class="plate-attires" id="attireChips" role="tablist" aria-label="Attire slots"></div>
  </header>

  <!-- Drill-down menu stack (left overlay). Levels slide over the stage;
       the character stays visible to the right of the panel. -->
  <nav id="menuStack" aria-label="Creation menu">
    <div class="menu-head">
      <button type="button" id="menuBack" class="head-btn" aria-label="Back">‹</button>
      <span id="menuTitle">CUSTOMIZE</span>
      <span id="menuCrumb"></span>
    </div>
    <div id="menuBody"></div>
  </nav>

  <!-- Slim confirm bar for try-on (Tekken's hover try-on, mobile form:
       tap previews on the fighter, then EQUIP commits). -->
  <div id="tryonBar" class="hidden" role="dialog" aria-label="Try-on">
    <div class="tryon-name" id="tryonName">—</div>
    <div class="tryon-actions">
      <button type="button" id="tryonEquip" class="prompt primary">EQUIP</button>
      <button type="button" id="tryonAdjust" class="prompt">ADJUST</button>
      <button type="button" id="tryonBack" class="prompt">✕</button>
    </div>
  </div>

  <!-- Detail overlay (right side, partial): placement, colors, finish,
       mirroring — Tekken's tools inside the item flow. -->
  <section id="detailSheet" class="hidden" aria-label="Item detail"></section>

  <!-- Conflict sheet: Tekken's Replace / Cancel. -->
  <section id="conflictSheet" class="hidden" role="alertdialog" aria-label="Replace conflict"></section>

  <!-- Bottom prompt bar: the contextual Tekken-style button prompts. -->
  <footer id="promptBar">
    <span class="prompt-chip" id="promptConfirm"><img class="glyph" data-glyph="glyphConfirm" alt="" hidden /><span>Select</span></span>
    <span class="prompt-chip" id="promptBack"><img class="glyph" data-glyph="glyphBack" alt="" hidden /><span>Back</span></span>
    <span class="prompt-chip" id="promptSave"><img class="glyph" data-glyph="glyphSave" alt="" hidden /><span>Save</span></span>
    <span id="catalogLine" class="catalog-line"></span>
  </footer>

  <div id="toast" class="hidden" role="status"></div>
  <div id="bootError" class="hidden" role="alert"></div>

<script type="module" src="./suite2.js"></script>
</body>
</html>
