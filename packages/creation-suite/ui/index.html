<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>Create a Fighter — Western Heart Creation Suite</title>
<link rel="stylesheet" href="./suite.css" />
</head>
<body>
<header class="topbar">
  <div class="topbar-row">
    <span class="suite-name">CREATE A FIGHTER</span>
    <button id="saveBtn" class="save-btn" type="button">SAVE</button>
  </div>
  <div class="topbar-row sub">
    <span id="fighterName" class="fighter-name">CUSTOM</span>
    <span class="attire-chips" id="attireChips" role="tablist" aria-label="Attire slots"></span>
  </div>
  <div id="catalogLine" class="catalog-line">loading catalogs…</div>
</header>

<main class="layout">
  <section class="stage" aria-label="Look summary">
    <div class="medallion" id="medallion">C</div>
    <div class="stage-body">
      <div class="stage-title" id="stageTitle">New look</div>
      <div class="chips" id="equippedChips"></div>
      <div class="morph-bars" id="morphBars"></div>
      <div class="stage-meta" id="stageMeta"></div>
    </div>
  </section>

  <section class="sheet" id="sheet" aria-live="polite"></section>
</main>

<nav class="tabbar" id="tabbar" aria-label="Creation Suite sections">
  <button type="button" data-tab="body" class="on">BODY</button>
  <button type="button" data-tab="face">FACE</button>
  <button type="button" data-tab="attire">ATTIRE</button>
  <button type="button" data-tab="ink">INK</button>
  <button type="button" data-tab="wardrobe">WARDROBE</button>
  <button type="button" data-tab="profile">PROFILE</button>
</nav>

<div class="overlay hidden" id="overlay">
  <div class="detail" id="detail" role="dialog" aria-modal="true"></div>
</div>

<div class="toast hidden" id="toast"></div>

<script type="module" src="./suite.js"></script>
</body>
</html>
