   ============================================================ */
let toastTimer;
function toast(msg){
  const t=$('#toast');t.textContent=msg;t.classList.add('show');
  clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),1600);
}
/* floating combat text */
function spawnFct(host,x,y,txt,color,crit){
  const el=document.createElement('span');
  el.className='fct'+(crit?' crit':'');
  el.textContent=txt;
  el.style.left=x+'px';el.style.top=y+'px';
  if(color) el.style.color=color;
  host.appendChild(el);
  setTimeout(()=>el.remove(),1000);
}
function fctOnStage(txt,color,crit){
  const st=$('#stage');
  if(!st||document.body.dataset.view!=='game') return;
  const r=st.getBoundingClientRect();
  spawnFct(st,r.width/2+(Math.random()*140-70),r.height*.42+(Math.random()*50-25),txt,color,crit);
}

/* tooltip singleton */
const tip=document.createElement('div');tip.className='tip';document.body.appendChild(tip);
const RARC={common:'#aab3c2',rare:'#57a8ff',epic:'#b57bff',legend:'#f2b01e'};
document.addEventListener('mouseover',e=>{
  const el=e.target.closest?e.target.closest('[data-tip-name]'):null;
  if(!el){tip.classList.remove('show');return}
  tip.innerHTML=`<div class="t-name" style="color:${RARC[el.dataset.tipR]||'var(--text)'}">${el.dataset.tipName}</div>
    <div class="t-type">${el.dataset.tipType||''}</div><div class="t-desc">${el.dataset.tipDesc||''}</div>`;
  const r=el.getBoundingClientRect();
  tip.style.left=Math.min(innerWidth-248,r.right+10)+'px';
  tip.style.top=Math.max(8,Math.min(innerHeight-130,r.top-6))+'px';
  tip.classList.add('show');
});

function gainXp(n){
  state.xp+=n;
  if(state.xp>=state.xpM){
    state.xp-=state.xpM; state.level++;
    SKINS[skin()].levelNow=state.level;
    bindAll('level').forEach(e=>{e.classList.remove('pop');void e.offsetWidth;e.classList.add('pop')});
    bindAll('msgBig').forEach(e=>e.innerHTML=SKINS[skin()].msgBig(state.level));
    const f=bindAll('msgFloat')[0];
    if(f){f.classList.add('show');clearTimeout(gainXp.t);gainXp.t=setTimeout(()=>f.classList.remove('show'),3200)}
    toast('LEVEL UP! → '+state.level);
  }
  syncXp();
}
function flash(){bindAll('flash').forEach(e=>{e.classList.remove('hit');void e.offsetWidth;e.classList.add('hit')})}
function spend(stat,amt){ if(state[stat]<amt) return false; state[stat]-=amt; return true; }

document.addEventListener('click',ev=>{
  const el=ev.target.closest('[data-act]'); if(!el) return;
  const act=el.dataset.act;
  switch(act){
    case 'quest':{
      const q=state.quests[+el.dataset.i];
      if(q.done){q.cur=0;q.done=false;}
      else{q.cur++;
        if(q.cur>=q.max){q.done=true;state.curr[0]+=100;gainXp(350);toast('QUEST COMPLETE  +100 ⬡  +350 XP');syncCurr();}
      }
      syncQuests();break;}
    case 'pausebtn':{
      const k=el.dataset.k;
      if(k==='resume'){bindAll('pauseOverlay').forEach(o=>o.classList.remove('open'));toast('RESUMED')}
      else if(k==='exit'){bindAll('pauseOverlay').forEach(o=>o.classList.remove('open'));toast('EXITED TO MENU (DEMO)')}
      else toast(k.toUpperCase());
      break;}
    case 'openpause': bindAll('pauseOverlay').forEach(o=>o.classList.add('open')); bindAll('msgFloat').forEach(f=>f.classList.remove('show')); break;
    case 'consume':{
      const i=+el.dataset.i;
      if(state.consum[i]<=0){toast('EMPTY');break}
      state.consum[i]--;
      if(i===0){state.hp=Math.min(state.hpM,state.hp+30);toast('+30 HP')}
      else if(i===1){state.en=Math.min(state.enM,state.en+25);toast('+25 ENERGY')}
      else if(i===2){flash();gainXp(120);toast('BOOM  +120 XP')}
      else {state.mp=Math.min(state.mpM,state.mp+20);toast('+20')}
      syncVitals();syncConsum();break;}
    case 'action':{
      const k=el.dataset.k;
      if(k==='a'){ if(!spend('en',8)){toast('NOT ENOUGH ENERGY');break} flash();gainXp(90);cool(el,900);fctOnStage('-'+(60+Math.floor(Math.random()*40)),null,Math.random()<.2);toast('ATTACK  +90 XP');if(Math.random()<.35)pushFeed('<b>YOU</b> eliminated <b>HOSTILE</b>')}
      else if(k==='b'){ if(!spend('en',14)){toast('NOT ENOUGH ENERGY');break} flash();gainXp(160);cool(el,1400);fctOnStage('-'+(110+Math.floor(Math.random()*60)),'#ffd257',true);toast('SKILL  +160 XP')}
      else if(k==='c'){state.mp=Math.min(state.mpM,state.mp+15);cool(el,1000);toast('SHIELD +15')}
      else {state.hp=Math.min(state.hpM,state.hp+20);cool(el,1000);toast('HEAL +20')}
      syncVitals();break;}
    case 'hslot':{state.sel=+el.dataset.i;syncSel();break}
    case 'zoomin': state.zoom=Math.min(2.2,state.zoom+.3);syncZoom();break;
    case 'zoomout': state.zoom=Math.max(.7,state.zoom-.3);syncZoom();break;
    case 'dpad': dpadMove(el.dataset.d,el);break;
    case 'closemsg':{
      const wrap=el.closest('.msg-float');
      if(wrap) wrap.classList.remove('show'); else toast('MESSAGE DISMISSED');
      break;}
    case 'pip': state.pip=+el.dataset.i;syncPips();break;
    case 'confirm': toast('CONFIRMED ✓');break;
    case 'cancel': toast('CANCELLED');break;
    case 'more': toast('MORE OPTIONS…');break;
    case 'menu': toast(el.dataset.k.replace(/([A-Z])/g,' $1').toUpperCase());break;
    case 'boss':{
      const c=SKINS[skin()];
      state.boss=Math.max(0,state.boss-.12);
      fctOnStage('-'+(120+Math.floor(Math.random()*60)),'#ff6b6b');
      if(state.boss<=0){
        state.boss=1;gainXp(500);state.curr[0]+=250;syncCurr();
        pushFeed(`<b>YOU</b> defeated <b>${c.boss.toUpperCase()}</b>`,true);
        toast('BOSS DEFEATED  +250 ⬡  +500 XP');
      }
      syncBoss();break;}
    case 'dlg':{
      const lines=SKINS[skin()].npc.lines;
      state.dlg=(state.dlg+1)%lines.length;
      bindAll('dlgText').forEach(e=>e.textContent=lines[state.dlg]);
      break;}
    case 'ring':{
      if(el.classList.contains('oncd')) break;
      const ms=SKINS[skin()].rings[+el.dataset.i][2];
      el.classList.add('oncd');
      const prog=el.querySelector('.r-prog'),t0=performance.now();
      (function step(now){
        const p=Math.min(1,(now-t0)/ms);
        prog.style.setProperty('--p',p*100);
        if(p<1&&el.isConnected) requestAnimationFrame(step);
        else el.classList.remove('oncd');
      })(t0);
      break;}
    case 'cast':{
      if(state.casting) break;
      if(!spend('mp',20)){toast('NOT ENOUGH MANA');break}
      syncVitals();state.casting=true;
      const ms=1600,t0=performance.now();
      (function step(now){
        const p=Math.min(1,(now-t0)/ms);
        bindAll('castFill').forEach(e=>e.style.width=(p*100)+'%');
        bindAll('castPct').forEach(e=>e.textContent=Math.round(p*100)+'%');
        if(p<1) requestAnimationFrame(step);
        else{
          state.casting=false;flash();gainXp(200);
          fctOnStage(200+Math.floor(Math.random()*120),'#ffd257',true);
          toast(SKINS[skin()].spell+'  +200 XP');
          setTimeout(()=>{bindAll('castFill').forEach(e=>e.style.width='0');bindAll('castPct').forEach(e=>e.textContent='READY')},350);
        }
      })(t0);
      break;}
    case 'toggle': el.classList.toggle('on');toast(el.classList.contains('on')?'ENABLED':'DISABLED');break;
    case 'cycle':{
      const opts=el.dataset.opts.split('|');
      el.dataset.i=(+el.dataset.i+1)%opts.length;
      el.textContent=opts[+el.dataset.i];
      toast('DIFFICULTY: '+el.textContent);break;}
    case 'fire':{
      if(state.ammo<=0) break;
      state.ammo--;
      if(state.ammo===0){
        $$('.ammo-box').forEach(b=>b.classList.add('reload'));
        toast('RELOADING…');
        setTimeout(()=>{
          const take=Math.min(24,state.ammoRes);
          state.ammoRes-=take;state.ammo=take||24;
          if(!take) state.ammoRes=120;
          $$('.ammo-box').forEach(b=>b.classList.remove('reload'));
          syncAmmo();toast('RELOADED');
        },900);
      }
      fctOnStage('-'+(18+Math.floor(Math.random()*14)));
      syncAmmo();break;}
    case 'tab': setTab(el.closest('.tabbed'),el.dataset.tab);break;
    case 'stnode':{
      const id=el.dataset.sid;
      const sk=SKINS[skin()].skills;
      if(state.stLearned.includes(id)){toast('ALREADY LEARNED');break}
      if(!stParents(id).some(p=>state.stLearned.includes(p))){toast('REQUIRES PREVIOUS SKILL');break}
      if(state.stPts<=0){toast('NO SKILL POINTS');break}
      state.stPts--;state.stLearned.push(id);
      syncSkills();toast(sk[id][1].toUpperCase()+' LEARNED');
      break;}
    case 'fct':{
      const r=el.getBoundingClientRect();
      const crit=Math.random()<.25;
      const cols=['#ff6b6b','#ffd257','#7ceaff','#8fe27b'];
      spawnFct(el,ev.clientX-r.left,ev.clientY-r.top,'-'+(40+Math.floor(Math.random()*160)),cols[Math.floor(Math.random()*cols.length)],crit);
      break;}
    /* genre expansion */
    case 'unit':{
      el.closest('.u-grid').querySelectorAll('.u-cell').forEach(c=>c.classList.toggle('sel',c===el));
      toast('UNIT '+(+el.dataset.i+1)+' SELECTED');break;}
    case 'cmd': cool(el,700+Math.random()*600);toast(el.dataset.k.toUpperCase());break;
    case 'prodadd':{
      state.prodQ[+el.dataset.i]++;
      bindAll('pq'+el.dataset.i).forEach(e=>e.textContent=state.prodQ[+el.dataset.i]);
      toast('ADDED TO QUEUE');break;}
    case 'endturn':{
      state.turn++;
      bindAll('turn').forEach(e=>e.textContent=state.turn);
      toast('TURN '+state.turn+' — EMPIRE ADVANCES');break;}
    case 'notif': toast('NOTIFICATION OPENED (DEMO)');break;
    case 'speed':{
      state.speed=+el.dataset.s;
      el.closest('.timectl').querySelectorAll('button').forEach(b=>b.classList.toggle('on',b===el));
      toast(state.speed===0?'PAUSED':'SPEED '+state.speed+'×');break;}
    case 'twup': toast('TOWER UPGRADED → LV 3  −320');break;
    case 'twsell': toast('TOWER SOLD  +180');break;
    case 'callwave':{state.wave++;syncWave();toast('WAVE '+state.wave+' CALLED EARLY  +50');break;}
    case 'ability':{
      if(el.classList.contains('cool')) break;
      if(!spend('mp',Math.min(+el.dataset.cost,40))){toast('NOT ENOUGH MANA');break}
      syncVitals();cool(el,+el.dataset.cd*300);
      fctOnStage('-'+(80+Math.floor(Math.random()*120)),'#7ceaff');
      toast('ABILITY CAST');break;}
    case 'mitem': toast(el.classList.contains('empty')?'EMPTY ITEM SLOT':'ITEM USED');break;
    case 'combo':{
      state.combo++;
      clearTimeout(comboTimer);
      comboTimer=setTimeout(()=>{state.combo=0;bindAll('combo').forEach(e=>e.textContent='–')},1100);
      bindAll('combo').forEach(e=>{e.textContent=state.combo;const p=e.closest('.fb-combo');p.classList.remove('pop');void p.offsetWidth;p.classList.add('pop')});
      break;}
    case 'nitro':{
      if(state.raceSp>10) break;
      state.raceSp=100;state.boost=Math.max(0,state.boost-.25);
      syncRace();toast('NITRO!');
      setTimeout(()=>{state.raceSp=0;syncRace()},2400);break;}
    case 'initchip': toast(el.classList.contains('foe')?'ENEMY TARGETED':'ALLY INSPECTED');break;
    case 'ap':{
      state.apPts=+el.dataset.i+1===state.apPts?+el.dataset.i:+el.dataset.i+1;
      $$('.ap i').forEach((p,i)=>p.classList.toggle('on',i<state.apPts));
      toast(state.apPts+' AP REMAINING');break;}
    case 'hitcycle':{
      const opts=[[78,''],[94,''],[52,'mid'],[23,'low']];
      state.hitI=(state.hitI+1)%opts.length;
      bindAll('hitPct').forEach(e=>{e.textContent=opts[state.hitI][0]+'%';e.className=opts[state.hitI][1]});
      break;}
    case 'tbend': toast('TURN ENDED — ENEMY PHASE');break;
    case 'playcard':{
      const cost=+el.dataset.cost;
      if(el.classList.contains('played')) break;
      if(state.cardEn<cost){toast('NOT ENOUGH ENERGY');break}
      state.cardEn-=cost;state.discN++;
      el.classList.add('played');
      bindAll('cardEn').forEach(e=>e.textContent=state.cardEn);
      bindAll('discN').forEach(e=>e.textContent=state.discN);
      toast('CARD PLAYED');
      setTimeout(()=>{
        if(!el.isConnected) return;
        el.classList.remove('played');
        state.discN--;
        state.cardEn=Math.min(state.cardEnM,state.cardEn+cost);
        bindAll('cardEn').forEach(e=>e.textContent=state.cardEn);
        bindAll('discN').forEach(e=>e.textContent=state.discN);
      },2600);
      break;}
  }
});
let comboTimer;
function syncRace(){
  bindAll('speedo').forEach(e=>e.style.setProperty('--sp',state.raceSp));
  bindAll('speed').forEach(e=>e.textContent=Math.round(state.raceSp*2.2));
  bindAll('gear').forEach(e=>e.textContent=state.raceSp>60?'6':state.raceSp>10?'4':'3');
  bindAll('boostFill').forEach(e=>e.style.width=(state.boost*100)+'%');
}
function cool(el,ms){el.style.setProperty('--cd',ms+'ms');el.classList.add('cool');setTimeout(()=>el.classList.remove('cool'),ms)}
function dpadMove(d,el){
  const dp=el?el.closest('.dpad'):bindAll('dpad')[0];
  if(d==='left') state.heading=(state.heading-15+360)%360;
  if(d==='right') state.heading=(state.heading+15)%360;
  if(d==='up'||d==='down'){state.stam=Math.max(0,state.stam-.08);syncStam();clearTimeout(dpadMove.t);dpadMove.t=setTimeout(()=>{state.stam=1;syncStam()},1200)}
  syncCompass();
  $$('.d-stick').forEach(s=>{
    const map={up:'0,-9px',down:'0,9px',left:'-9px,0',right:'9px,0'};
    s.style.transform=`translate(${map[d]})`;
    clearTimeout(dpadMove.rt);dpadMove.rt=setTimeout(()=>$$('.d-stick').forEach(x=>x.style.transform=''),160);
  });
}

function openMenuTab(tab){
  const o=bindAll('menuOverlay')[0];
  if(!o) return false;
  const panel=o.querySelector('.tabbed');
  const cur=panel.querySelector('.tab-btn.on');
  if(o.classList.contains('open')&&cur&&cur.dataset.tab===tab){o.classList.remove('open');return true}
  bindAll('pauseOverlay').forEach(x=>x.classList.remove('open'));
  setTab(panel,tab);
  o.classList.add('open');
  return true;
}
document.addEventListener('keydown',ev=>{
  if(ev.key>='1'&&ev.key<='8'){state.sel=+ev.key-1;syncSel()}
  else if(ev.key==='ArrowLeft'){dpadMove('left');ev.preventDefault()}
  else if(ev.key==='ArrowRight'){dpadMove('right');ev.preventDefault()}
  else if(ev.key==='ArrowUp'){dpadMove('up');ev.preventDefault()}
  else if(ev.key==='ArrowDown'){dpadMove('down');ev.preventDefault()}
  else if(ev.key==='e'||ev.key==='E'){
    const d=bindAll('dlgFloat')[0];
    if(d) d.classList.toggle('show');
  }
  else if(ev.key==='Tab'){if(openMenuTab('inv'))ev.preventDefault()}
  else if(ev.key==='m'||ev.key==='M'){openMenuTab('map')}
  else if(ev.key==='k'||ev.key==='K'){openMenuTab('skills')}
  else if(ev.key==='Escape'){
    const im=bindAll('menuOverlay').filter(o=>o.classList.contains('open'));
    if(im.length){im.forEach(o=>o.classList.remove('open'));return}
    const o=bindAll('pauseOverlay')[0];
    if(o&&!o.classList.contains('open')) bindAll('msgFloat').forEach(f=>f.classList.remove('show'));
    if(o){o.classList.toggle('open')}
  }
});

/* slow energy regen so attack demo keeps working */
setInterval(()=>{
  if(!state) return;
  let dirty=false;
  if(state.en<state.enM){state.en=Math.min(state.enM,state.en+1);dirty=true}
  if(dirty) syncVitals();
},900);

/* 1s ticker: buffs count down + loop, wave timer, waypoint distance drift */
setInterval(()=>{
  if(!state) return;
  const c=SKINS[skin()];
  state.buffs=state.buffs.map((v,i)=>v>0?v-1:c.buffData[i][2]);
  syncBuffs();
  if(state.waveT>0) state.waveT--;
  else{state.wave++;state.waveT=272;toast('WAVE '+state.wave+' INCOMING');pushFeed(`<b>WAVE ${state.wave}</b> has begun`,true)}
  syncWave();
  state.wpDist=Math.max(8,state.wpDist+Math.floor(Math.random()*9)-5);
  bindAll('wpDist').forEach(e=>e.textContent=state.wpDist+'m');
  /* genre expansion tickers (respect city time-speed; pause = frozen) */
  const mult=state.speed;
  if(mult>0){
    /* production queue */
    state.prodP+=.04*mult;
    if(state.prodP>=1){
      state.prodP=0;
      const i=state.prodQ[0]>0?0:(state.prodQ[1]>0?1:-1);
      if(i>=0){state.prodQ[i]--;bindAll('pq'+i).forEach(e=>e.textContent=state.prodQ[i])}
    }
    bindAll('prodBar').forEach(e=>e.style.width=(state.prodP*100)+'%');
    bindAll('prodFill').forEach(e=>e.style.height=(state.prodP*100)+'%');
    /* battle-royale zone */
    state.zoneT-=mult;
    if(state.zoneT<=0){state.zoneT=96;state.alive=Math.max(2,state.alive-Math.floor(Math.random()*6)-2);bindAll('alive').forEach(e=>e.textContent=state.alive)}
    bindAll('zoneT').forEach(e=>e.textContent=Math.floor(state.zoneT/60)+':'+String(state.zoneT%60).padStart(2,'0'));
    bindAll('zoneRing').forEach(e=>e.style.setProperty('--zp',state.zoneT/96*100));
    /* fight round timer */
    state.fightT=state.fightT>0?state.fightT-1:99;
    bindAll('fightT').forEach(e=>e.textContent=state.fightT);
    /* sports clock */
    state.matchT+=mult;
    bindAll('matchT').forEach(e=>e.textContent=Math.floor(state.matchT/60)+':'+String(state.matchT%60).padStart(2,'0'));
    /* survival day/night dial (full cycle ≈ 2 min) */
    state.dayT=(state.dayT+3*mult)%360;
    bindAll('dayDial').forEach(e=>e.style.setProperty('--day',state.dayT+'deg'));
    /* boost slowly regenerates */
    if(state.boost<1){state.boost=Math.min(1,state.boost+.02*mult);bindAll('boostFill').forEach(e=>e.style.width=(state.boost*100)+'%')}
  }
},1000);

/* ============================================================
   TOOLBAR — skin & view switching
   ============================================================ */
function setSkin(s){
  document.body.dataset.skin=s;
  initState(); renderAll();
  $('#skinSel').value=s;
}
function setView(v){
  document.body.dataset.view=v;
  $$('#viewSeg button').forEach(b=>b.classList.toggle('on',b.dataset.viewBtn===v));
  fitStage();
}
$('#skinSel').addEventListener('change',e=>setSkin(e.target.value));
$('#viewSeg').addEventListener('click',e=>{const b=e.target.closest('[data-view-btn]');if(b)setView(b.dataset.viewBtn)});
function setMode(m){
  hudMode=m;
  renderGame(); syncAll();
  $('#modeSel').value=m;
}
$('#modeSel').addEventListener('change',e=>setMode(e.target.value));

/* keep the stage sized to the real toolbar height (it wraps on narrow windows) */
function fitStage(){
  const tb=document.querySelector('.toolbar');
  if(tb) document.documentElement.style.setProperty('--tbh',tb.offsetHeight+'px');
}
addEventListener('resize',fitStage);
fitStage();

/* deep-link support: ?skin=modern&view=game */
const qs=new URLSearchParams(location.search);
setSkin(SKINS[qs.get('skin')]?qs.get('skin'):'futuristic');
setView(['showcase','game'].includes(qs.get('view'))?qs.get('view'):'showcase');
setMode(MODE_NOTES[qs.get('mode')]?qs.get('mode'):'shooter');
if(['inv','map','skills'].includes(qs.get('open'))) openMenuTab(qs.get('open'));
</script>
</body>
