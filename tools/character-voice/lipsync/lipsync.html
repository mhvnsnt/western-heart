<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <title>WH lip-sync cue generator</title>
  <!--
    Western Heart lip-sync pipeline page (worker 22, 2026-10-22).
    Runs lip-sync-engine (MIT, biolimbo/lip-sync-engine 1.0.3 — WASM port
    of Rhubarb Lip Sync + PocketSphinx) in the browser to turn a voice
    line WAV into Rhubarb-style mouthCues JSON.

    The engine + WASM + acoustic model load from the package's own CDN
    defaults (unpkg). This is a PIPELINE tool — run by the crew via
    lipsync.mjs (Playwright), not shipped to players.

    Usage (via driver): lipsync.html?wav=<url>&text=<dialog text>
    The page sets window.__cues when done, or window.__error on failure.
  -->
</head>
<body>
  <p id="status">loading lip-sync engine…</p>
  <script type="module">
    import { analyze, loadAudio } from 'https://unpkg.com/lip-sync-engine@1.0.3/dist/index.mjs';
    const $ = (s) => document.querySelector(s);
    const q = new URLSearchParams(location.search);
    try {
      const wavUrl = q.get('wav');
      const text = q.get('text') || '';
      if (!wavUrl) throw new Error('missing ?wav=<url>');
      $('#status').textContent = 'decoding ' + wavUrl + ' …';
      const { pcm16 } = await loadAudio(wavUrl, 16000);
      $('#status').textContent = 'analyzing ' + pcm16.length + ' samples …';
      const result = await analyze(pcm16, { dialogText: text, sampleRate: 16000 });
      window.__cues = result;
      $('#status').textContent = 'done: ' + result.mouthCues.length + ' cues';
    } catch (e) {
      window.__error = String(e && e.message || e);
      $('#status').textContent = 'ERROR: ' + window.__error;
    }
  </script>
</body>
</html>
