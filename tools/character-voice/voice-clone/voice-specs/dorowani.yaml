# DOROWANI — voice spec (PILOT for the voice cloning pipeline)
# Owner voice direction (2026-10-22, verbatim brief):
#   "voice like Squirtle (creature sounds + his Japanese word bursts).
#    Voice moments: win poses/taunts, intro sequences, cutscenes."
# Rejected: Hubert TTS — "it doesn't have any of the qualities I asked for".
# Target qualities: RASPY, LOW, SQUIRTLE-LIKE CREATURE voice.

fighter: dorowani
engine: chatterbox   # owner law: Chatterbox is the character-voice default

direction: >-
  Squirtle-style creature vocalizations + Japanese word bursts. He does NOT
  speak in sentences — Pokemon/Digimon-style, Pikachu energy with Japanese
  vocabulary. Hungry, mischievous trickster; kappa-yokai crocodile demon of
  the Eastern Mind swamp. First lines: "Konnichiwa arigato Ichiban Bankai."

qualities:
  - raspy
  - low register
  - creature-like (non-human barks, growls, chitters)
  - playful trickster energy (never menacing, never cute-small)

clone:
  # Reference audio: 10-60 s sample embodying raspy/low/creature.
  # The owner directs voice: THEY provide or approve this sample.
  # Clean it first: python3 ../phone_cleanup_chain.py raw.wav ref.wav
  # Until set, generation runs archetype-directed (params + FX only).
  reference_audio: null

chatterbox_params:
  exaggeration: 0.75   # high: creature expressiveness lives here
  cfg_weight: 0.5
  temperature: 0.85
  seed: 20261022       # fixed seed: the voice must be STABLE across runs

# What TTS alone cannot give a creature, the deterministic FX chain adds
# (local CPU ffmpeg — no ML, no weights). The clone gives the voice its
# identity; the FX gives it its species.
creature_fx:
  pitch_semitones: -5      # low: drop a fourth-plus
  formant_shift: 0.82      # bigger throat, not a chipmunk
  growl: true
  growl_amount: 0.3        # subtle: rasp, not distortion-pedal
  breath: keep            # creature breaths sell the physicality

# Lines resolve from game/data/voices/dorowani.json when omitted here.
# Listed explicitly so the director can reorder/reword per session.
lines:
  - id: intro-01
    text: "Konnichiwa!"
  - id: intro-02
    text: "Ichiban!"
  - id: intro-03
    text: "Doro doro!"
  - id: win-01
    text: "Bankai!"
  - id: win-02
    text: "Arigato! Arigato!"
  - id: win-03
    text: "Ichi-ban!"
  - id: taunt-01
    text: "Heh... konnichiwa."
  - id: taunt-02
    text: "Dorowani!"
  - id: select-01
    text: "Dorowani!"

# Review loop: generate -> deliver (direct download links) -> owner listens
# on phone -> approve or redirect ("raspiter", "lower", "more growl") ->
# adjust this spec -> re-run. Iteration is cheap; the voice is not final
# until the owner says it is.
