<div style="box-sizing:border-box;max-width:100%;padding:12px;background:var(--hatch-widget-surface);border:1px solid var(--hatch-widget-border);border-radius:12px;color:var(--hatch-widget-text);font-family:system-ui,sans-serif;">
<div style="font-weight:700;font-size:16px;margin-bottom:8px;">Pantera Tail Positioner</div>
<div style="font-size:13px;color:var(--hatch-widget-muted);margin-bottom:8px;">Drag to rotate. Sliders move the tail. Hit Save when it looks right.</div>
<div id="tail3d" style="width:100%;height:320px;background:var(--hatch-widget-surface-muted);border-radius:8px;overflow:hidden;touch-action:none;"></div>
<div style="margin-top:12px;display:grid;gap:10px;">
<div><label style="font-size:13px;">Left / Right (X): <span id="vx" style="font-weight:700;">0.30</span></label><input id="sx" type="range" min="-1" max="1" step="0.01" value="0.3" style="width:100%;"></div>
<div><label style="font-size:13px;">Forward / Back (Y): <span id="vy" style="font-weight:700;">0.30</span></label><input id="sy" type="range" min="-1" max="1" step="0.01" value="0.3" style="width:100%;"></div>
<div><label style="font-size:13px;">Up / Down (Z): <span id="vz" style="font-weight:700;">0.00</span></label><input id="sz" type="range" min="-1.5" max="1.5" step="0.01" value="0" style="width:100%;"></div>
</div>
<button id="saveTail" style="margin-top:12px;width:100%;padding:12px;background:var(--hatch-widget-accent);color:var(--hatch-widget-on-accent);border:none;border-radius:8px;font-size:15px;font-weight:700;cursor:pointer;">Save Position</button>
<div id="tailOut" style="margin-top:8px;font-size:13px;color:var(--hatch-widget-muted);word-break:break-all;"></div>
</div>
<script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
<script src="https://unpkg.com/three@0.160.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://unpkg.com/three@0.160.0/examples/js/controls/OrbitControls.js"></script>
<script>
(function(){
const GLB_B64 = "__GLB_B64__";
const state = window.hatchWidget.getState({x:0.3,y:0.3,z:0.0});
let tailObj = null, scene, camera, renderer, controls;
function init(){
  const el = document.getElementById('tail3d');
  scene = new THREE.Scene();
  scene.background = new THREE.Color(0x808080);
  camera = new THREE.PerspectiveCamera(45, el.clientWidth/el.clientHeight, 0.01, 100);
  camera.position.set(-3, 0, 1);
  renderer = new THREE.WebGLRenderer({antialias:true});
  renderer.setSize(el.clientWidth, el.clientHeight);
  el.appendChild(renderer.domElement);
  controls = new THREE.OrbitControls(camera, renderer.domElement);
  controls.target.set(0,0,0);
  controls.enableDamping = true;
  const light = new THREE.DirectionalLight(0xffffff, 2);
  light.position.set(-2,-2,3);
  scene.add(light);
  scene.add(new THREE.AmbientLight(0xffffff, 0.6));
  const bin = atob(GLB_B64);
  const buf = new ArrayBuffer(bin.length);
  const view = new Uint8Array(buf);
  for(let i=0;i<bin.length;i++) view[i]=bin.charCodeAt(i);
  new THREE.GLTFLoader().parse(buf, '', function(gltf){
    scene.add(gltf.scene);
    gltf.scene.traverse(function(o){
      if(o.name==='PanteraTail'){ tailObj=o; }
      if(o.isMesh){
        if(!o.material || o.material.name===''){
          o.material = new THREE.MeshStandardMaterial({color:0x999999, roughness:0.8});
        }
      }
    });
    applyState();
  });
  function animate(){ requestAnimationFrame(animate); controls.update(); renderer.render(scene,camera); }
  animate();
}
function applyState(){
  document.getElementById('sx').value=state.x;
  document.getElementById('sy').value=state.y;
  document.getElementById('sz').value=state.z;
  document.getElementById('vx').textContent=Number(state.x).toFixed(2);
  document.getElementById('vy').textContent=Number(state.y).toFixed(2);
  document.getElementById('vz').textContent=Number(state.z).toFixed(2);
  if(tailObj){ tailObj.position.set(state.x, state.y, state.z); }
}
['sx','sy','sz'].forEach(function(id){
  document.getElementById(id).addEventListener('input', function(e){
    const k = id==='sx'?'x':id==='sy'?'y':'z';
    state[k]=parseFloat(e.target.value);
    window.hatchWidget.setState(state);
    applyState();
  });
});
document.getElementById('saveTail').addEventListener('click', function(){
  const txt = "X="+Number(state.x).toFixed(2)+" Y="+Number(state.y).toFixed(2)+" Z="+Number(state.z).toFixed(2);
  document.getElementById('tailOut').textContent = txt + " (copied!)";
  if(navigator.clipboard){ navigator.clipboard.writeText(txt); }
});
window.addEventListener('hatch-widget-state', function(e){ Object.assign(state, e.detail.state); applyState(); });
applyState();
init();
})();
</script>
