<div id="marker" style="position:absolute;width:24px;height:24px;background:#ff2222;border:3px solid #fff;border-radius:50%;transform:translate(-50%,-50%);cursor:grab;box-shadow:0 2px 8px rgba(0,0,0,0.5);"></div>
</div>
<div style="margin-top:12px;display:grid;gap:10px;max-width:600px;margin-left:auto;margin-right:auto;">
<div><label style="font-size:13px;">Left / Right: <span id="vx" style="font-weight:700;">50</span>%</label><input id="sx" type="range" min="0" max="100" step="0.5" value="50" style="width:100%;"></div>
<div><label style="font-size:13px;">Up / Down: <span id="vy" style="font-weight:700;">62</span>%</label><input id="sy" type="range" min="0" max="100" step="0.5" value="62" style="width:100%;"></div>
</div>
<button id="saveTail" style="margin-top:12px;width:100%;max-width:600px;margin-left:auto;margin-right:auto;display:block;padding:12px;background:var(--hatch-widget-accent);color:var(--hatch-widget-on-accent);border:none;border-radius:8px;font-size:15px;font-weight:700;cursor:pointer;">Save Position</button>
<div id="tailOut" style="margin-top:8px;font-size:14px;font-weight:700;text-align:center;word-break:break-all;"></div>
</div>
<script>
(function(){
const state = window.hatchWidget.getState({x:50, y:62});
const marker = document.getElementById('marker');
const wrap = document.getElementById('wrap');
function apply(){
  marker.style.left = state.x + '%';
  marker.style.top = state.y + '%';
  document.getElementById('sx').value = state.x;
  document.getElementById('sy').value = state.y;
  document.getElementById('vx').textContent = Number(state.x).toFixed(1);
  document.getElementById('vy').textContent = Number(state.y).toFixed(1);
}
function setFromEvent(e){
  const r = wrap.getBoundingClientRect();
  let cx = (e.touches ? e.touches[0].clientX : e.clientX);
  let cy = (e.touches ? e.touches[0].clientY : e.clientY);
  state.x = Math.max(0, Math.min(100, (cx - r.left) / r.width * 100));
  state.y = Math.max(0, Math.min(100, (cy - r.top) / r.height * 100));
  window.hatchWidget.setState(state);
  apply();
}
let dragging = false;
marker.addEventListener('pointerdown', function(e){ dragging = true; e.preventDefault(); });
window.addEventListener('pointermove', function(e){ if(dragging) setFromEvent(e); });
window.addEventListener('pointerup', function(){ dragging = false; });
wrap.addEventListener('touchstart', function(e){ setFromEvent(e); }, {passive:true});
wrap.addEventListener('touchmove', function(e){ setFromEvent(e); e.preventDefault(); }, {passive:false});
document.getElementById('sx').addEventListener('input', function(e){
  state.x = parseFloat(e.target.value);
  window.hatchWidget.setState(state); apply();
});
document.getElementById('sy').addEventListener('input', function(e){
  state.y = parseFloat(e.target.value);
  window.hatchWidget.setState(state); apply();
});
document.getElementById('saveTail').addEventListener('click', function(){
  const t = "X=" + Number(state.x).toFixed(1) + "% Y=" + Number(state.y).toFixed(1) + "%";
  document.getElementById('tailOut').textContent = t + " — copied!";
  if(navigator.clipboard) navigator.clipboard.writeText(t);
});
window.addEventListener('hatch-widget-state', function(e){
  Object.assign(state, e.detail.state); apply();
});
apply();
})();
</script>
