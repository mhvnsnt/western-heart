<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Western Heart — Create Fighter</title>
<link rel="stylesheet" href="css/create-fighter.css">
</head>
<body>
<!-- ============ FULL-SCREEN 3D FIGHTER PREVIEW (never covered) ============ -->
<canvas id="preview3d"></canvas>
<div id="stage-vignette"></div>

<!-- ============ TOP BAR ============ -->
<header id="topbar">
  <div class="tb-left">
    <div class="tb-title">CREATE&nbsp;FIGHTER</div>
    <div id="breadcrumb" class="tb-crumb">New Fighter &gt; Attire 1 &gt; Body</div>
  </div>
  <div class="tb-mid">
    <div id="fighter-name" class="tb-fighter">NEW FIGHTER</div>
    <div id="attire-tabs" class="attire-tabs" role="tablist" aria-label="Attire slots"></div>
  </div>
  <div class="tb-right">
    <div id="wallet" class="wallet" title="Fight Money">💰 <span id="wallet-amt">12,400</span>G</div>
    <button id="btn-photo" class="btn btn-gold" title="Photo mode: capture outfit thumbnail">📸 PHOTO</button>
    <button id="btn-back-game" class="btn btn-gold" title="Back to game menu">🏠 GAME</button>
    <button id="btn-save" class="btn btn-green" title="Save fighter">💾 SAVE</button>
    <button id="btn-export" class="btn" title="Download fighter JSON">⤓ EXPORT</button>
    <button id="btn-load" class="btn" title="Load saved fighter">⤒ LOAD</button>
    <input type="file" id="file-load" accept="application/json" hidden>
  </div>
</header>

<!-- ============ LEFT RAIL (categories) ============ -->
<nav id="left-rail" aria-label="Customization categories">
  <button class="rail-btn active" data-tab="body" aria-label="Body"><span class="rail-ico">🦾</span><span class="rail-tx">BODY</span></button>
  <button class="rail-btn" data-tab="attire" aria-label="Attire"><span class="rail-ico">🥋</span><span class="rail-tx">ATTIRE</span></button>
  <button class="rail-btn" data-tab="wardrobe" aria-label="Wardrobe"><span class="rail-ico">👕</span><span class="rail-tx">WARDROBE</span></button>
  <button class="rail-btn" data-tab="profile" aria-label="Profile"><span class="rail-ico">📇</span><span class="rail-tx">PROFILE</span></button>
  <button class="rail-btn" data-tab="moveset" aria-label="Moveset"><span class="rail-ico">🥊</span><span class="rail-tx">MOVESET</span></button>
</nav>

<!-- ============ RIGHT RAIL (context panel — floats over backdrop, never the fighter) ============ -->
<aside id="right-rail">
  <div id="panel-head">
    <div id="panel-title">BODY</div>
    <div id="panel-sub"></div>
  </div>
  <div id="panel-body"></div>
</aside>

<!-- ============ BOTTOM BAR ============ -->
<footer id="bottombar">
  <div class="bb-left">
    <button id="btn-roster" class="btn" title="Fighter select (base)">🧍 FIGHTER SELECT</button>
    <span id="slot-status" class="bb-hint">Moveset shared across all 4 attires 🔒 · Appearance per attire</span>
  </div>
  <div class="bb-right">
    <span id="save-toast" class="bb-hint"></span>
    <span class="bb-hint">v0.1 · PROTOTYPE — geometry proxy markers shown where 3D meshes are pending</span>
  </div>
</footer>

<!-- ============ MODALS ============ -->
<div id="modal-scrim" hidden></div>
<div id="modal" hidden>
  <div id="modal-card">
    <div id="modal-title"></div>
    <div id="modal-body"></div>
    <div id="modal-actions"></div>
  </div>
</div>

<!-- ============ LOADING ============ -->
<div id="loader"><div class="spin"></div><div>LOADING FIGHTER…</div></div>

<script type="importmap">
{ "imports": { "three": "./vendor/three.module.js" } }
</script>
<script type="module" src="js/app.js"></script>
</body>
</html>
