<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Western Heart — Art Studio (Image Editor)</title>
<link rel="stylesheet" href="vendor/tui-image-editor/tui-color-picker.css">
<link rel="stylesheet" href="vendor/tui-image-editor/tui-image-editor.css">
<style>
  html,body{margin:0;padding:0;height:100%;background:#0b0f16;color:#e8ecf4;
    font-family:system-ui,-apple-system,sans-serif;}
  #topbar{display:flex;align-items:center;gap:12px;padding:10px 16px;
    background:#101623;border-bottom:1px solid #232c40;}
  #topbar h1{font-size:16px;margin:0;letter-spacing:.08em;}
  #topbar .hint{font-size:12px;color:#8b93a7;}
  #topbar .spacer{flex:1;}
  .btn{background:#1a2233;color:#e8ecf4;border:1px solid #2c3a55;border-radius:6px;
    padding:8px 14px;font-size:13px;cursor:pointer;}
  .btn:hover{background:#232f47;}
  .btn-gold{background:#8a6d1f;border-color:#a5852a;}
  #editor-wrap{height:calc(100vh - 53px);}
  /* TOAST UI dark-theme tweaks to match the suite */
  .tui-image-editor-container{background-color:#0b0f16 !important;}
</style>
</head>
<body>
<div id="topbar">
  <h1>🎨 ART STUDIO</h1>
  <span class="hint">TOAST UI Image Editor (MIT) — crop, rotate, filters, text, shapes, draw.
    Load an image to start.</span>
  <span class="spacer"></span>
  <input type="file" id="file-input" accept="image/*" hidden>
  <button class="btn" id="btn-load">📂 LOAD IMAGE</button>
  <button class="btn btn-gold" id="btn-download">⤓ DOWNLOAD</button>
  <button class="btn" id="btn-back" title="Back to Create Fighter">← FIGHTER</button>
</div>
<div id="editor-wrap"></div>

<script src="vendor/tui-image-editor/fabric.js"></script>
<script src="vendor/tui-image-editor/tui-color-picker.js"></script>
<script src="vendor/tui-image-editor/tui-image-editor.js"></script>
<script>
// TOAST UI ImageEditor v3.15.3 (MIT, NHN). Vendored — no CDN dependency.
var editor = new tui.ImageEditor('#editor-wrap', {
  includeUI: {
    loadImage: null,          // we wire our own loader below
    theme: {},
    menu: ['crop','flip','rotate','draw','shape','icon','text','filter'],
    initMenu: 'filter',
    uiSize: { width: '100%', height: '100%' },
    menuBarPosition: 'bottom'
  },
  cssMaxWidth: 1200,
  cssMaxHeight: 800,
  selectionStyle: { cornerSize: 20, rotatingPointOffset: 70 }
});

document.getElementById('btn-load').onclick = function(){
  document.getElementById('file-input').click();
};
document.getElementById('file-input').onchange = function(e){
  var f = e.target.files[0];
  if (!f) return;
  editor.loadImageFromFile(f).then(function(){
    editor.ui.activeMenuEvent();
  }).catch(function(err){
    alert('Could not load image: ' + err.message);
  });
};
document.getElementById('btn-download').onclick = function(){
  var dataURL = editor.toDataURL();
  var a = document.createElement('a');
  a.href = dataURL;
  a.download = 'wh-art-edit.png';
  document.body.appendChild(a); a.click(); a.remove();
};
document.getElementById('btn-back').onclick = function(){
  location.href = 'index.html';
};
// If opened with ?img=<url>, auto-load it.
(function(){
  var m = /[?&]img=([^&]+)/.exec(location.search);
  if (m) editor.loadImageFromURL(decodeURIComponent(m[1]), 'wh-image')
    .catch(function(){ /* user can load manually */ });
})();
</script>
</body>
</html>
