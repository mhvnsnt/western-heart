name: ui-sources
# OWNER LAW (t123u, Oct 23 2026): no hand-made menus. Every changed/new menu
# screen must cite its Tekken/teardown source in game/ui_sources.json.
on:
  pull_request:
  merge_group:
    types: [checks_requested]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
jobs:
  ui-sources:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: |
            tools/ui-sources
      - name: ui_sources gate
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
        run: python3 tools/ui-sources/check.py "$BASE" "$HEAD"
