# PR safety guard (2026-10-23, after PR #498).
# PR #498 merged 34 s after an agent's "merge main into branch" commit, before any
# check had finished, and deleted 4,225 files (incl. .github/, game/js, CLAUDE.md).
# This job is a REQUIRED status check on main (branch protection), so a PR cannot
# merge until it passes. It fails when the PR:
#   1. deletes more than 25 files, or
#   2. deletes ANY file under .github/ or game/js/, or CLAUDE.md / AGENTS.md,
#      unless the PR carries the label 'owner-approved-deletion'; or
#   3. is stale: its fork point is more than 200 commits behind main
#      (label 'owner-approved-stale' to override).
name: pr-safety-guard
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled]
  merge_group:
    types: [checks_requested]
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
  pull-requests: read
jobs:
  pr-safety-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
          sparse-checkout: .github
      - name: Deletion and stale-branch guard
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
          LABELS: ${{ toJson(github.event.pull_request.labels.*.name) }}
        run: |
          set -euo pipefail
          LIMIT=25; STALE=200; FAIL=0
          FORK=$(git merge-base "$HEAD" "$BASE")
          git diff --no-renames --diff-filter=D --name-only "$FORK" "$HEAD" > deleted.txt || true
          N=$(wc -l < deleted.txt)
          grep -E '^(\.github/|game/js/|CLAUDE\.md$|AGENTS\.md$)' deleted.txt > protected.txt || true
          P=$(wc -l < protected.txt)
          BEHIND=$(git rev-list --count "$FORK..$BASE")
          echo "Deleted: $N  protected-path deletions: $P  fork point behind main by: $BEHIND"
          if echo "$LABELS" | grep -q '"owner-approved-deletion"'; then
            echo "owner-approved-deletion label present"
          else
            if [ "$N" -gt "$LIMIT" ]; then echo "::error::PR deletes $N files (limit $LIMIT)."; FAIL=1; fi
            if [ "$P" -gt 0 ]; then echo "::error::PR deletes protected files:"; cat protected.txt; FAIL=1; fi
          fi
          if [ "$BEHIND" -gt "$STALE" ] && ! echo "$LABELS" | grep -q '"owner-approved-stale"'; then
            echo "::error::Stale branch: fork point is $BEHIND commits behind main (limit $STALE). Merge current main into the branch with a FULL (non-sparse) checkout, then re-check."; FAIL=1
          fi
          [ "$FAIL" -eq 0 ] || { echo "First 100 deleted files:"; head -100 deleted.txt; exit 1; }
          echo OK
