# Deletion guard: blocks mass deletions without the owner's explicit OK.
# Fails if a PR or push to main deletes more than 20 files, or any file under canon/,
# unless the PR carries the label "owner-approved-deletion" (only the owner should add it).
# Background: Bannon PR #63 (Oct 12 2026) was described as "archive 83 files" but deleted 9,006.
name: deletion-guard
on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, labeled, unlabeled]
  push:
    branches: [main]
  merge_group:
    types: [checks_requested]
# CI minute diet (Plan B): superseded PR runs are cancelled, not billed.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
  pull-requests: read
jobs:
  deletion-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # Fast path: only the two commits under test, no other branches/tags.
          # (fetch-depth: 0 pulled every branch and timed out at 10 min.)
          ref: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
          fetch-depth: 1
          filter: blob:none
      - name: Fetch base and head (shallow, deepen until merge-base exists; fail closed)
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then echo "No base"; exit 0; fi
          git fetch -q --no-tags --filter=blob:none --depth=1 origin "$BASE" "$HEAD"
          for d in 50 200 1000 5000; do
            git merge-base "$BASE" "$HEAD" >/dev/null 2>&1 && break
            git fetch -q --no-tags --filter=blob:none --deepen=$d origin "$BASE" "$HEAD"
          done
          git merge-base "$BASE" "$HEAD" >/dev/null 2>&1 || git fetch -q --no-tags --filter=blob:none --unshallow origin "$BASE" "$HEAD"
          # Fail closed: if no merge-base, the diff step below must not run on a guess.
          git merge-base "$BASE" "$HEAD"
      - name: Check deletions
        env:
          GH_TOKEN: ${{ github.token }}
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          PR_LABELS: ${{ toJson(github.event.pull_request.labels.*.name) }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          LIMIT=20
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then echo "No base; skipping"; exit 0; fi
          if [ "$EVENT" = "pull_request" ]; then RANGE="$BASE...$HEAD"; else RANGE="$BASE..$HEAD"; fi
          git diff --no-renames --diff-filter=D --name-only "$RANGE" > deleted.txt || true
          N=$(wc -l < deleted.txt); CANON=$(grep -c '^canon/' deleted.txt || true)
          echo "Deleted files: $N (canon/: $CANON)"
          if [ "$N" -le "$LIMIT" ] && [ "$CANON" -eq 0 ]; then echo "OK"; exit 0; fi
          LABELS="$PR_LABELS"
          if [ "$EVENT" = "push" ]; then
            LABELS=$(gh api "repos/$REPO/commits/$HEAD/pulls" --jq '[.[].labels[].name]' 2>/dev/null || echo '[]')
          fi
          if echo "$LABELS" | grep -q '"owner-approved-deletion"'; then echo "Approved by owner label"; exit 0; fi
          echo "::error::This change deletes $N files ($CANON under canon/). Mass deletions need the owner's explicit OK: open a separate PR titled 'DELETION: ...' listing every file and have the owner add the 'owner-approved-deletion' label."
          head -200 deleted.txt
          exit 1
