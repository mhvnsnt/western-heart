# Merge-tree guard: fails when a merge commit pushed to main drops files that
# main had but the merged PR never deleted.
#
# Catches the PR #974 failure mode (2026-10-23): the PR head was clean (0
# deletions, all PR-time CI green), but the merge commit was constructed from
# the stale branch tree instead of a real 3-way merge, silently dropping 150
# files main had gained since the fork point. No PR-time guard can catch that
# -- the damage is created after checks pass, at merge-commit construction.
#
# For each merge commit M in the push range (before..after, first-parent):
#   P1 = first parent (main side), P2 = second parent (branch side),
#   B = merge-base(P1, P2)
#   D1 = files deleted between P1 and M
#   D2 = files deleted between B and P2 (the PR's own deletions)
#   VIOLATION = D1 - D2  ->  files the merge dropped that the PR never deleted
#
# Explicit escape: the merged PR carries the "owner-approved-deletion" label
# (looked up via the commits API, like deletion-guard.yml does for pushes).
# A degenerate fake merge (merge tree byte-identical to the branch tree while
# main added files after the fork) gets an extra loud message.
name: merge-tree-guard
on:
  push:
    branches: [main]
# CI minute diet (Plan B): superseded push runs are cancelled, not billed.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
permissions:
  contents: read
  pull-requests: read
jobs:
  merge-tree-guard:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          filter: blob:none
          # Repo is GBs; the guard only needs trees/diffs (git diff/ls-tree
          # never read blobs), so keep the working tree sparse.
          sparse-checkout: .github
          sparse-checkout-cone-mode: true
      - name: Guard self-test
        run: python3 -m unittest discover -s .github/scripts -p 'test_merge_tree_guard.py' -v
      - name: Check merge commits in push range
        env:
          GH_TOKEN: ${{ github.token }}
          BEFORE_SHA: ${{ github.event.before }}
          AFTER_SHA: ${{ github.sha }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          python3 .github/scripts/merge_tree_guard.py
