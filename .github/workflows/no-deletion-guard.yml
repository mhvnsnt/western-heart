name: no-deletion-guard
on:
  pull_request:
    types: [opened, synchronize, reopened, labeled, unlabeled]
  merge_group:
    types: [checks_requested]
# CI minute diet (Plan B): superseded PR runs are cancelled, not billed.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
permissions:
  contents: read
  pull-requests: read
jobs:
  guard:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          # Fast path: only the two commits under test, no other branches/tags.
          # (fetch-depth: 0 pulled every branch and timed out at 10 min.)
          ref: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha || github.sha }}
          fetch-depth: 1
          filter: blob:none
          sparse-checkout: .github
          sparse-checkout-cone-mode: true
      - name: Fetch base and head (shallow, deepen until merge-base exists; fail closed)
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
        run: |
          set -euo pipefail
          if [ -z "$BASE" ] || [ "$BASE" = "0000000000000000000000000000000000000000" ]; then echo "No base"; exit 0; fi
          git fetch -q --no-tags --filter=blob:none --depth=1 origin "$BASE" "$HEAD"
          for d in 50 200 1000 5000; do
            git merge-base "$BASE" "$HEAD" >/dev/null 2>&1 && break
            git fetch -q --no-tags --filter=blob:none --deepen=$d origin "$BASE" "$HEAD"
          done
          git merge-base "$BASE" "$HEAD" >/dev/null 2>&1 || git fetch -q --no-tags --filter=blob:none --unshallow origin "$BASE" "$HEAD"
          # Fail closed: if no merge-base, the diff step below must not run on a guess.
          git merge-base "$BASE" "$HEAD"
      - name: Fail if PR deletes files (unless labelled approved-deletion)
        env:
          LABELS: ${{ join(github.event.pull_request.labels.*.name, ',') }}
          BASE: ${{ github.event.pull_request.base.sha || github.event.merge_group.base_sha }}
          HEAD: ${{ github.event.pull_request.head.sha || github.event.merge_group.head_sha }}
        run: |
          set -eo pipefail
          D=$(git diff --diff-filter=D --name-only "$BASE"..."$HEAD")
          if [ -z "$D" ]; then echo "No deletions."; exit 0; fi
          echo "Deleted files:"; echo "$D"
          case ",$LABELS," in *,approved-deletion,*) echo "approved-deletion label present"; exit 0;; esac
          echo "::error::PR deletes files. See docs/NO-DATA-LOSS-RULES.md. Owner must add label approved-deletion."
          exit 1
