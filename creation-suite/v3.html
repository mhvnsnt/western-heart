<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Western Heart — Character Customization</title>
<style>
:root{
  --gold:#c8a84b; --gold-dim:#8a7434; --text:#eceae2; --muted:#8a8778;
  --panel:rgba(8,8,10,0.78); --red:#b03a2e;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%;overflow:hidden}
body{background:#000;color:var(--text);font-family:"Segoe UI",system-ui,-apple-system,sans-serif}
/* ===== Fullscreen 3D ===== */
#stage{position:fixed;inset:0;background:radial-gradient(ellipse at 50% 65%,#16161c 0%,#050506 75%)}
#stage canvas{width:100%;height:100%;display:block}
#loadmsg{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;color:var(--muted);font-size:13px;letter-spacing:3px}
/* ===== Fighter name plate (bottom-left, Tekken style) ===== */
#plate{position:fixed;left:18px;bottom:16px;pointer-events:none;z-index:5}
#plate .fname{font-size:34px;font-weight:800;letter-spacing:8px;color:var(--text);text-transform:uppercase;text-shadow:0 2px 12px #000;line-height:1}
#plate .fsub{font-size:11px;letter-spacing:5px;color:var(--gold);text-transform:uppercase;margin-top:4px}
/* ===== Right floating panel ===== */
#panel{position:fixed;top:0;right:0;bottom:0;width:320px;max-width:86vw;background:var(--panel);backdrop-filter:blur(14px);-webkit-backdrop-filter:blur(14px);border-left:1px solid rgba(200,168,75,0.25);display:flex;flex-direction:column;z-index:10}
#panel-head{padding:14px 16px 10px;border-bottom:1px solid rgba(200,168,75,0.2)}
#panel-head h1{font-size:13px;font-weight:800;letter-spacing:4px;color:var(--gold);text-transform:uppercase}
#panel-head .sub{font-size:9px;letter-spacing:3px;color:var(--muted);text-transform:uppercase;margin-top:2px}
/* Category tabs */
#catbar{display:flex;border-bottom:1px solid rgba(255,255,255,0.08)}
#catbar button{flex:1;background:none;border:none;border-bottom:2px solid transparent;color:var(--muted);font-size:10px;font-weight:700;letter-spacing:1px;text-transform:uppercase;cursor:pointer;padding:12px 4px;min-height:44px}
#catbar button.active{color:var(--gold);border-bottom-color:var(--gold)}
#catbar button .n{color:var(--gold);font-size:9px;margin-left:3px}
/* Scrollable content */
#scroll{flex:1;overflow-y:auto;padding:6px 0 30px;-webkit-overflow-scrolling:touch}
/* Slot rows — Tekken style: clean rows, subtle dividers */
.slotrow{border-bottom:1px solid rgba(255,255,255,0.06)}
.slothead{display:flex;align-items:center;padding:13px 16px;cursor:pointer;min-height:52px}
.slothead:active{background:rgba(255,255,255,0.04)}
.slothead .sid{font-size:9px;color:var(--muted);width:26px;letter-spacing:1px}
.slothead .sname{font-size:13px;font-weight:600;letter-spacing:2px;text-transform:uppercase;flex:1}
.slothead .sstat{font-size:10px;letter-spacing:2px;color:var(--muted);text-transform:uppercase}
.slothead .chev{color:var(--muted);font-size:12px;margin-left:8px;transition:transform .15s}
.slotrow.open .slothead .chev{transform:rotate(90deg)}
.slotrow.equipped .slothead{border-left:3px solid var(--gold);padding-left:13px}
.slotrow.equipped .slothead .sstat{color:var(--gold)}
.slotrow.blocked{opacity:0.35}
.slotrow.blocked .slothead{cursor:default}
.slotbody{display:none;padding:4px 16px 14px}
.slotrow.open .slotbody{display:block}
/* Equip button — minimal */
.equipbtn{width:100%;padding:10px;background:transparent;border:1px solid var(--gold-dim);border-radius:2px;color:var(--gold);font-size:11px;font-weight:700;letter-spacing:3px;text-transform:uppercase;cursor:pointer;min-height:42px;margin:6px 0}
.equipbtn.equipped{background:rgba(200,168,75,0.12)}
.equipbtn.danger{border-color:var(--red);color:#e0705f}
/* Color swatches — 5 per Tekken spec */
.cswatches{display:flex;gap:8px;margin:8px 0}
.csw{width:36px;height:36px;border-radius:50%;border:2px solid rgba(255,255,255,0.15);cursor:pointer;position:relative}
.csw.sel{border-color:var(--gold)}
.csw .cl{position:absolute;bottom:-16px;left:50%;transform:translateX(-50%);font-size:8px;color:var(--muted)}
.clabel{font-size:10px;letter-spacing:2px;color:var(--muted);text-transform:uppercase;margin:10px 0 2px}
/* Sleek thin sliders */
.srow{display:flex;align-items:center;gap:10px;margin:10px 0}
.srow label{width:110px;flex-shrink:0;font-size:11px;color:var(--text);letter-spacing:1px}
.srow input[type=range]{flex:1;-webkit-appearance:none;appearance:none;height:2px;background:rgba(255,255,255,0.18);border-radius:1px;outline:none}
.srow input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;appearance:none;width:14px;height:14px;border-radius:50%;background:var(--gold);cursor:pointer}
.srow input[type=range]::-moz-range-thumb{width:14px;height:14px;border-radius:50%;background:var(--gold);border:none;cursor:pointer}
.srow .val{width:52px;text-align:right;color:var(--muted);font-size:10px;font-variant-numeric:tabular-nums}
/* Preset chips */
.chips{display:flex;gap:6px;flex-wrap:wrap;margin:8px 0}
.chips button{padding:7px 12px;border:1px solid rgba(255,255,255,0.15);border-radius:20px;background:transparent;color:var(--text);font-size:11px;cursor:pointer;letter-spacing:1px}
.chips button.active{background:var(--gold);color:#0a0a0c;border-color:var(--gold);font-weight:700}
/* Gizmo + mode — compact */
.minirow{display:flex;gap:6px;margin:8px 0}
.minirow button{flex:1;padding:8px 4px;border:1px solid rgba(255,255,255,0.12);border-radius:2px;background:transparent;color:var(--muted);font-size:10px;letter-spacing:1px;text-transform:uppercase;cursor:pointer;min-height:38px}
.minirow button.active{color:var(--gold);border-color:var(--gold)}
.sect{font-size:10px;font-weight:700;color:var(--gold);letter-spacing:3px;text-transform:uppercase;margin:14px 0 4px;opacity:0.9}
.note{color:var(--muted);font-size:11px;line-height:1.5;margin:8px 0}
.savepreset{display:flex;gap:6px;margin:8px 0}
.savepreset input{flex:1;padding:9px 10px;border:1px solid rgba(255,255,255,0.15);border-radius:2px;background:rgba(255,255,255,0.05);color:var(--text);font-size:12px}
.savepreset button{padding:9px 14px;border:none;border-radius:2px;background:var(--gold);color:#0a0a0c;font-size:11px;font-weight:700;letter-spacing:1px;cursor:pointer;text-transform:uppercase}
.copybtn{margin-top:10px;padding:11px;border:1px solid var(--gold-dim);border-radius:2px;background:transparent;color:var(--gold);font-size:11px;font-weight:700;letter-spacing:3px;cursor:pointer;width:100%;text-transform:uppercase}
#copied{color:var(--gold);font-size:11px;margin-top:6px;display:none;text-align:center;letter-spacing:2px}
.modified{color:var(--gold);font-size:10px;margin-left:6px}
#conflict-note{display:none;padding:10px 16px;background:rgba(176,58,46,0.15);border-left:3px solid var(--red);font-size:11px;color:#e09080;margin:8px 0}
</style>
</head>
<body>
<div id="stage"><div id="loadmsg">LOADING MODEL</div><canvas id="pp3d"></canvas></div>
<div id="plate"><div class="fname" id="fighter-name">DXMMII</div><div class="fsub" id="fighter-sub">Character Customization</div></div>
<div id="panel">
  <div id="panel-head"><h1>Customize</h1><div class="sub">Western Heart</div></div>
  <div id="catbar">
    <button data-cat="head" class="active">Head<span class="n" id="n-head"></span></button>
    <button data-cat="body">Body<span class="n" id="n-body"></span></button>
    <button data-cat="acc">Items<span class="n" id="n-acc"></span></button>
    <button data-cat="fx">Fx<span class="n" id="n-fx"></span></button>
  </div>
  <div id="scroll">
    <div id="conflict-note"></div>
    <div id="slotlist"></div>
    <div id="arms-rig" style="display:none;padding:0 16px">
      <div class="sect">Gizmo</div>
      <div class="minirow" id="gizmobtns">
        <button data-g="translate" class="active">Move</button>
        <button data-g="rotate">Rotate</button>
        <button data-g="off">Off</button>
      </div>
      <div class="sect">Poses <span class="modified" id="modflag" style="display:none">●</span></div>
      <div class="chips" id="presets"></div>
      <div class="savepreset"><input type="text" id="newpresetname" placeholder="Name this pose..." maxlength="24"><button id="savepresetbtn">Save</button></div>
      <div class="minirow"><button id="resetbtn" style="border-color:var(--red);color:#e0705f">Reset</button></div>
      <div class="sect">Mode</div>
      <div class="minirow" id="modetoggle">
        <button data-m="wing" class="active">Wing</button>
        <button data-m="together">Together</button>
      </div>
      <div class="sect">Position</div>
      <div class="srow"><label>Spread</label><input type="range" id="s_spread" min="-0.4" max="0.5" step="0.005" value="0"><span class="val" id="v_spread"></span></div>
      <div class="srow"><label>Shift L/R</label><input type="range" id="s_shiftlr" min="-0.4" max="0.4" step="0.005" value="0"><span class="val" id="v_shiftlr"></span></div>
      <div class="srow"><label>Up / Down</label><input type="range" id="s_updown" min="-0.4" max="0.5" step="0.005" value="0"><span class="val" id="v_updown"></span></div>
      <div class="srow"><label>Fwd / Back</label><input type="range" id="s_fwdbak" min="-0.4" max="0.4" step="0.005" value="0"><span class="val" id="v_fwdbak"></span></div>
      <div class="sect">Rotation</div>
      <div class="srow"><label>Flap U/D</label><input type="range" id="s_pitch" min="-90" max="90" step="1" value="0"><span class="val" id="v_pitch"></span></div>
      <div class="srow"><label>Flap F/B</label><input type="range" id="s_yaw" min="-90" max="90" step="1" value="0"><span class="val" id="v_yaw"></span></div>
      <div class="srow"><label>Roll</label><input type="range" id="s_roll" min="-90" max="90" step="1" value="0"><span class="val" id="v_roll"></span></div>
      <div class="sect">Fine-tune</div>
      <div class="srow"><label>Left nudge</label><input type="range" id="s_lnudge" min="-0.2" max="0.2" step="0.005" value="0"><span class="val" id="v_lnudge"></span></div>
      <div class="srow"><label>Right nudge</label><input type="range" id="s_rnudge" min="-0.2" max="0.2" step="0.005" value="0"><span class="val" id="v_rnudge"></span></div>
      <div class="srow"><label>Scale</label><input type="range" id="s_scale" min="0.5" max="1.5" step="0.01" value="1"><span class="val" id="v_scale"></span></div>
      <button class="copybtn" id="copyvals">Copy values</button>
      <div id="copied">COPIED</div>
    </div>
  </div>
</div>
<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/TransformControls.js"></script>
<script>
(function(){
"use strict";
/* ============ TEKKEN 7 SLOT ARCHITECTURE ============ */
var SLOTS={
  1:{name:'Head',grp:'head'},2:{name:'Hair',grp:'head'},3:{name:'Full Head',grp:'head'},
  4:{name:'Hair Acc.',grp:'head'},5:{name:'Glasses',grp:'head'},6:{name:'Face',grp:'head'},
  7:{name:'Facial Hair',grp:'head'},8:{name:'Face Paint',grp:'head'},
  9:{name:'Upper Body',grp:'body'},10:{name:'Full Body',grp:'body'},11:{name:'Lower Body',grp:'body'},
  18:{name:'Footwear',grp:'body'},
  12:{name:'Upper Acc.',grp:'acc'},13:{name:'Lower Acc.',grp:'acc'},14:{name:'Extra Arms',grp:'acc'},
  15:{name:'Effects',grp:'fx'},17:{name:'Aura',grp:'fx'}
};
var GROUPS={head:[1,2,3,4,5,6,7,8],body:[9,10,11,18],acc:[12,13,14],fx:[15,17]};
var CONFLICTS={3:[1,2,4,5,6,7],10:[9,11],9:[10],11:[10],1:[3],2:[3],4:[3],5:[3],6:[3],7:[3]};
var DEFAULT_COLORS=['#c8a84b','#b03a2e','#2e5db0','#e8e8e8','#1a1a1a'];
/* ============ STATE ============ */
var store={load:function(){try{return JSON.parse(localStorage.getItem('wh-cs-v3')||'{}')}catch(e){return{}}},
           save:function(s){try{localStorage.setItem('wh-cs-v3',JSON.stringify(s))}catch(e){}}};
var DEF_POSE={spread:0,shiftlr:0,updown:0,fwdbak:0,pitch:0,yaw:0,roll:0,lnudge:0,rnudge:0,scale:1};
var DEFAULTS={
  gyro:Object.assign({},DEF_POSE),
  docock:Object.assign({},DEF_POSE,{spread:0.07,updown:0.145,fwdbak:-0.03,pitch:70}),
  floating:Object.assign({},DEF_POSE,{spread:-0.075,updown:0.155,fwdbak:-0.10,pitch:-26})
};
var LABELS={gyro:'Gyro',docock:'Doc Ock',floating:'Floating'};
var S=Object.assign({cat:'head',preset:'gyro',mode:'wing',saved:{},customOrder:[],
  equipped:{14:{name:'DXMMII Extra Arms',colors:DEFAULT_COLORS.slice()}},openSlot:14,
  skin:0},store.load());
if(!S.equipped) S.equipped={};
function persist(){store.save({cat:S.cat,preset:S.preset,mode:S.mode,saved:S.saved,customOrder:S.customOrder,equipped:S.equipped,skin:S.skin});}
function pnames(){return ['gyro','docock','floating'].concat(S.customOrder||[]);}
function pvals(n){if(S.saved&&S.saved[n])return Object.assign({},S.saved[n]);if(DEFAULTS[n])return Object.assign({},DEFAULTS[n]);return Object.assign({},DEF_POSE);}
function pmod(n){return !!(S.saved&&S.saved[n]);}
function isEquipped(id){return !!S.equipped[id];}
function blockedBy(id){
  for(var k in S.equipped){if(CONFLICTS[k]&&CONFLICTS[k].indexOf(id)>=0)return parseInt(k,10);}
  return 0;
}
/* ============ SLOT UI ============ */
var listEl=document.getElementById('slotlist'),rigEl=document.getElementById('arms-rig');
function renderTabs(){
  var counts={head:0,body:0,acc:0,fx:0};
  for(var id in S.equipped){var g=SLOTS[id]&&SLOTS[id].grp;if(g)counts[g]++;}
  document.getElementById('n-head').textContent=counts.head||'';
  document.getElementById('n-body').textContent=counts.body||'';
  document.getElementById('n-acc').textContent=counts.acc||'';
  document.getElementById('n-fx').textContent=counts.fx||'';
  document.querySelectorAll('#catbar button').forEach(function(b){b.classList.toggle('active',b.dataset.cat===S.cat);});
}
function renderSlots(){
  renderTabs();
  listEl.innerHTML='';
  var cn=document.getElementById('conflict-note');cn.style.display='none';
  GROUPS[S.cat].forEach(function(id){
    var meta=SLOTS[id],eq=isEquipped(id),blk=blockedBy(id),open=S.openSlot===id;
    var row=document.createElement('div');
    row.className='slotrow'+(eq?' equipped':'')+(blk?' blocked':'')+(open?' open':'');
    var head=document.createElement('div');head.className='slothead';
    head.innerHTML='<span class="sid">'+id+'</span><span class="sname">'+meta.name+'</span>'+
      '<span class="sstat">'+(eq?'Equipped':(blk?'Blocked':'Empty'))+'</span><span class="chev">›</span>';
    if(!blk)head.onclick=function(){S.openSlot=open?0:id;persist();renderSlots();};
    row.appendChild(head);
    if(open&&!blk){
      var body=document.createElement('div');body.className='slotbody';
      if(eq){
        var eb=document.createElement('button');eb.className='equipbtn equipped';eb.textContent='Unequip';
        eb.onclick=function(){unequip(id);};body.appendChild(eb);
        /* 5 color slots — Tekken spec */
        var cl=document.createElement('div');cl.className='clabel';cl.textContent='Colors (5 slots)';body.appendChild(cl);
        var sw=document.createElement('div');sw.className='cswatches';
        for(var ci=0;ci<5;ci++){
          (function(idx){
            var d=document.createElement('div');d.className='csw';
            d.style.background=S.equipped[id].colors[idx]||'#333';
            d.title='Color '+(idx+1);
            d.onclick=function(){
              var cur=S.equipped[id].colors[idx];
              var ni=(DEFAULT_COLORS.indexOf(cur)+1)%DEFAULT_COLORS.length;
              S.equipped[id].colors[idx]=DEFAULT_COLORS[ni<0?0:ni];
              persist();renderSlots();
            };
            var lb=document.createElement('span');lb.className='cl';lb.textContent=idx+1;d.appendChild(lb);
            sw.appendChild(d);
          })(ci);
        }
        body.appendChild(sw);
      }else{
        var b2=document.createElement('button');b2.className='equipbtn';b2.textContent='Equip';
        b2.onclick=function(){equip(id);};body.appendChild(b2);
        var note=document.createElement('div');note.className='note';
        note.textContent='Slot '+id+' · ready for items.';body.appendChild(note);
      }
      row.appendChild(body);
    }
    listEl.appendChild(row);
  });
  /* ARMS rig visible only when slot 14 open+equipped and acc tab */
  var showRig=(S.cat==='acc'&&isEquipped(14)&&S.openSlot===14);
  rigEl.style.display=showRig?'block':'none';
  if(showRig)applyPose();
}
function equip(id){
  var blk=blockedBy(id);
  if(blk){var cn=document.getElementById('conflict-note');
    cn.textContent='Slot '+id+' blocked by '+SLOTS[blk].name+' ('+blk+'). Unequip it first.';
    cn.style.display='block';return;}
  var conflicts=CONFLICTS[id]||[],auto=[];
  conflicts.forEach(function(c){if(isEquipped(c)){delete S.equipped[c];auto.push(c);}});
  var nm={14:'DXMMII Extra Arms'}[id]||(SLOTS[id].name+' Item');
  S.equipped[id]={name:nm,colors:DEFAULT_COLORS.slice()};
  S.openSlot=id;persist();renderSlots();
  if(auto.length){var cn2=document.getElementById('conflict-note');
    cn2.textContent='Auto-unequipped: '+auto.map(function(c){return SLOTS[c].name;}).join(', ');
    cn2.style.display='block';}
}
function unequip(id){delete S.equipped[id];if(S.openSlot===id)S.openSlot=0;persist();renderSlots();}
document.querySelectorAll('#catbar button').forEach(function(b){
  b.onclick=function(){S.cat=b.dataset.cat;S.openSlot=0;persist();renderSlots();};
});
/* ============ 3D SCENE ============ */
var canvas=document.getElementById('pp3d');
var renderer=new THREE.WebGLRenderer({canvas:canvas,antialias:true,alpha:true});
var scene=new THREE.Scene();
var camera=new THREE.PerspectiveCamera(42,2,0.01,100);
var orbit=new THREE.OrbitControls(canvas,canvas);orbit.enableDamping=true;
scene.add(new THREE.HemisphereLight(0xffffff,0x444455,1.25));
var keyL=new THREE.DirectionalLight(0xfff2dd,1.0);keyL.position.set(2,3,4);scene.add(keyL);
var rimL=new THREE.DirectionalLight(0xc8a84b,0.5);rimL.position.set(-3,2,-3);scene.add(rimL);
var tc=new THREE.TransformControls(camera,canvas);scene.add(tc);
tc.addEventListener('dragging-changed',function(e){orbit.enabled=!e.value;});
var tcMode='translate';tc.setMode('translate');
var armL=null,armR=null,selected=null;
var ray=new THREE.Raycaster(),mouse=new THREE.Vector2();
canvas.addEventListener('pointerdown',function(e){
  if(tc.dragging)return;
  var r=canvas.getBoundingClientRect();
  mouse.x=((e.clientX-r.left)/r.width)*2-1;mouse.y=-((e.clientY-r.top)/r.height)*2+1;
  ray.setFromCamera(mouse,camera);
  var hits=ray.intersectObjects([armL,armR].filter(Boolean),false);
  if(hits.length){selected=hits[0].object;tc.attach(selected);}
  else{tc.detach();selected=null;}
});
var params=new URLSearchParams(location.search);
var modelUrl=params.get('model')||'https://raw.githubusercontent.com/mhvnsnt/western-heart/main/tools/dxmmii-poser/dxmmii_widget2.glb';
var fname=params.get('name');
if(fname)document.getElementById('fighter-name').textContent=fname.toUpperCase();
new THREE.GLTFLoader().load(modelUrl,function(gltf){
  document.getElementById('loadmsg').style.display='none';
  scene.add(gltf.scene);
  var meshes=[];
  gltf.scene.traverse(function(o){if(o.isMesh)meshes.push(o);});
  meshes.sort(function(a,b){
    var sa=new THREE.Box3().setFromObject(a).getSize(new THREE.Vector3()).length();
    var sb=new THREE.Box3().setFromObject(b).getSize(new THREE.Vector3()).length();
    return sa-sb;});
  if(meshes.length>=3){
    var c0=new THREE.Box3().setFromObject(meshes[0]).getCenter(new THREE.Vector3());
    var c1=new THREE.Box3().setFromObject(meshes[1]).getCenter(new THREE.Vector3());
    if(c0.x>c1.x){armL=meshes[0];armR=meshes[1];}else{armL=meshes[1];armR=meshes[0];}
  }else if(meshes.length===2){armL=meshes[0];armR=meshes[1];}
  applyPose();
  var box=new THREE.Box3().setFromObject(gltf.scene);
  var c=box.getCenter(new THREE.Vector3());
  orbit.target.copy(c);
  camera.position.set(c.x+2.2,c.y-0.6,c.z+0.4);
},undefined,function(){document.getElementById('loadmsg').textContent='FAILED TO LOAD MODEL';});
/* ============ PARTPOSER RIG (slot 14) ============ */
function cur(){return pvals(S.preset);}
function applyPose(){
  var V=cur();
  [['s_spread','v_spread','spread',3],['s_shiftlr','v_shiftlr','shiftlr',3],['s_updown','v_updown','updown',3],
   ['s_fwdbak','v_fwdbak','fwdbak',3],['s_pitch','v_pitch','pitch',0],['s_yaw','v_yaw','yaw',0],
   ['s_roll','v_roll','roll',0],['s_lnudge','v_lnudge','lnudge',3],['s_rnudge','v_rnudge','rnudge',3],
   ['s_scale','v_scale','scale',2]].forEach(function(m){
    var el=document.getElementById(m[0]);if(!el)return;
    el.value=V[m[2]];
    document.getElementById(m[1]).textContent=m[3]===0?V[m[2]]+'°':Number(V[m[2]]).toFixed(m[3]);
  });
  if(armL&&armR&&isEquipped(14)){
    var lS,rS;
    if(S.mode==='wing'){lS=V.spread+V.shiftlr+V.lnudge;rS=-V.spread+V.shiftlr+V.rnudge;}
    else{lS=V.spread+V.shiftlr+V.lnudge;rS=V.spread+V.shiftlr+V.rnudge;}
    var pr=V.pitch*Math.PI/180,yw=V.yaw*Math.PI/180,rl=V.roll*Math.PI/180;
    /* AXIS MAP (user-verified, DO NOT CHANGE): pos.x=screen fwd/back, pos.y=screen up/down, pos.z=screen left/right */
    armL.position.set(V.fwdbak,V.updown,lS);
    armR.position.set(V.fwdbak,V.updown,rS);
    armL.rotation.set(pr,yw,rl);armR.rotation.set(-pr,-yw,-rl);
    armL.scale.setScalar(V.scale);armR.scale.setScalar(V.scale);
    armL.visible=armR.visible=true;
  }else if(armL&&armR){
    armL.visible=armR.visible=false;
  }
  var pb=document.getElementById('presets');pb.innerHTML='';
  pnames().forEach(function(n){
    var b=document.createElement('button');b.textContent=(LABELS[n]||n)+(pmod(n)?' *':'');
    if(n===S.preset)b.classList.add('active');
    b.onclick=function(){S.preset=n;persist();applyPose();};pb.appendChild(b);});
  document.getElementById('modflag').style.display=pmod(S.preset)?'inline':'none';
  document.querySelectorAll('#modetoggle button').forEach(function(b){b.classList.toggle('active',b.dataset.m===S.mode);});
  document.querySelectorAll('#gizmobtns button').forEach(function(b){b.classList.toggle('active',b.dataset.g===tcMode);});
}
function saveSlider(k,v){var V=cur();V[k]=v;S.saved=S.saved||{};S.saved[S.preset]=V;persist();applyPose();}
[['s_spread','spread'],['s_shiftlr','shiftlr'],['s_updown','updown'],['s_fwdbak','fwdbak'],['s_pitch','pitch'],
 ['s_yaw','yaw'],['s_roll','roll'],['s_lnudge','lnudge'],['s_rnudge','rnudge'],['s_scale','scale']].forEach(function(p){
  document.getElementById(p[0]).addEventListener('input',function(e){saveSlider(p[1],parseFloat(e.target.value));});
});
document.querySelectorAll('#modetoggle button').forEach(function(b){
  b.onclick=function(){S.mode=b.dataset.m;persist();applyPose();};});
document.querySelectorAll('#gizmobtns button').forEach(function(b){
  b.onclick=function(){tcMode=b.dataset.g;
    if(tcMode==='off'){tc.detach();selected=null;}else{tc.setMode(tcMode);if(selected)tc.attach(selected);}
    applyPose();};});
document.getElementById('resetbtn').onclick=function(){if(S.saved)delete S.saved[S.preset];persist();applyPose();};
document.getElementById('savepresetbtn').onclick=function(){
  var n=document.getElementById('newpresetname').value.trim().toLowerCase().replace(/[^a-z0-9]+/g,'-');
  if(!n||DEFAULTS[n]||(S.customOrder||[]).indexOf(n)>=0)return;
  S.saved=S.saved||{};S.saved[n]=cur();S.customOrder=(S.customOrder||[]).concat([n]);S.preset=n;
  document.getElementById('newpresetname').value='';persist();applyPose();};
document.getElementById('copyvals').onclick=function(){
  var V=cur();
  var t='PartPoser ['+S.preset+'] slot14: '+Object.keys(V).map(function(k){return k+'='+(typeof V[k]==='number'?V[k].toFixed(3):V[k]);}).join(' ');
  if(navigator.clipboard)navigator.clipboard.writeText(t);
  var c=document.getElementById('copied');c.style.display='block';setTimeout(function(){c.style.display='none';},2000);};
function resize(){var w=innerWidth,h=innerHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();}
window.addEventListener('resize',resize);resize();
(function anim(){requestAnimationFrame(anim);orbit.update();renderer.render(scene,camera);})();
renderSlots();
})();
</script>
</body>
</html>
