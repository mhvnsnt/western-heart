<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Western Heart — Stage Test Harness (Lane 4)</title>
<style>
  html, body { margin: 0; padding: 0; background: #000; overflow: hidden; }
  #game-canvas { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; }
  #status { position: fixed; top: 8px; left: 8px; color: #0f0; font: 13px monospace;
            background: rgba(0,0,0,0.6); padding: 6px 10px; border-radius: 6px; z-index: 10; }
</style>
<script type="importmap">
{ "imports": {
    "three": "./vendor/three.module.js",
    "three/addons/": "./vendor/addons/"
} }
</script>
</head>
<body>
<canvas id="game-canvas"></canvas>
<div id="status">boot…</div>
<script type="module">
import { Arena } from './js/scene.js';
import { STAGES } from './js/stages.js';

const errors = [];
window.addEventListener('error', (e) => errors.push(String(e.message || e.error)));
window.addEventListener('unhandledrejection', (e) => errors.push('rejection: ' + String(e.reason)));

const canvas = document.getElementById('game-canvas');
const status = document.getElementById('status');
const arena = new Arena(canvas);
let idx = -1;

// Drive with: await window.__test.next() -> { id, name, errorCount }
// Optional ?stage=<id> preselects the starting stage (Lane E verification).
const _qs = new URLSearchParams(location.search).get('stage');
window.__test = {
  stages: STAGES.map(s => ({ id: s.id, name: s.name })),
  errors,
  async jump(id) {
    const i = STAGES.findIndex(s => s.id === id);
    if (i < 0) return { error: 'unknown stage ' + id };
    idx = i - 1;
    return this.next();
  },
  async next() {
    idx++;
    if (idx >= STAGES.length) return { done: true };
    const s = STAGES[idx];
    const before = errors.length;
    status.textContent = `loading ${idx + 1}/${STAGES.length}: ${s.id}`;
    await arena.setStage(s.id);
    // let a few frames render (particles, lights settle)
    await new Promise(r => setTimeout(r, 700));
    arena.update(1 / 60, null, null);
    arena.render();
    await new Promise(r => setTimeout(r, 300));
    arena.render();
    const newErrors = errors.slice(before);
    status.textContent = `${idx + 1}/${STAGES.length}: ${s.name} ${newErrors.length ? 'ERRORS: ' + newErrors.join(' | ') : 'OK'}`;
    return { id: s.id, name: s.name, errorCount: newErrors.length, newErrors };
  },
  info() { return { count: STAGES.length, idx }; },
  snap() {
    arena.render();
    return canvas.toDataURL('image/png');
  }
};
status.textContent = `ready: ${STAGES.length} stages`;
</script>
</body>
</html>
