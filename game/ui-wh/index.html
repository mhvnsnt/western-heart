<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>WESTERN HEART — 西部の心</title>
<link rel="stylesheet" href="ui.css" />
<script src="title-config.js"></script>
<script src="title-variant.js"></script>
</head>
<body>
<!-- Western Heart proprietary menu/UI system. Each screen is a <section data-screen>.
     Layout lineage (re-built, not copied): TTT2/T6 title + mode list + select grid,
     Def Jam / WWE VS split, T6 HUD, Urban Reign pause list, WWE results card.
     Route with #title #menu #modes #select #vs #hud #pause #results. -->
<div id="wall" class="wall"></div>

<section data-screen="title" class="screen title">
  <div class="logo"><div class="logo-en">WESTERN<b>HEART</b></div><div class="logo-jp">パンテーラ ・ 黒豹</div></div>
  <div class="press">PRESS START <span>・ スタート</span></div>
  <div class="legal">TONG-NOU TRIAL · a lost multiverse bastard child</div>
</section>

<section data-screen="menu" class="screen menu">
  <div class="side-logo">WESTERN<b>HEART</b><i>西部の心</i></div>
  <nav class="list" id="menu-list"></nav>
  <div class="blurb" id="menu-blurb"></div>
</section>

<section data-screen="modes" class="screen modes">
  <h2 class="title-bar">MODE SELECT <i>モード選択</i></h2>
  <div class="cards" id="mode-cards"></div>
</section>

<section data-screen="select" class="screen select">
  <h2 class="title-bar">CHOOSE YOUR VESSEL <i>魂を選べ</i><span class="timer" id="sel-timer">30</span></h2>
  <div class="sel-side p1" id="sel-p1"></div>
  <div class="grid" id="sel-grid"></div>
  <div class="sel-side p2" id="sel-p2"></div>
</section>

<section data-screen="vs" class="screen vs">
  <div class="vs-half l" id="vs-l"></div>
  <div class="vs-half r" id="vs-r"></div>
  <div class="vs-mark">VS<i>対</i></div>
  <div class="vs-stage">THE SHRINE OF THE BLADE · 刃の社</div>
</section>

<section data-screen="hud" class="screen hud">
  <div class="hud-top">
    <div class="plate l"><div class="bar"><u style="width:80%"></u><i style="width:72%"></i></div><div class="nm" id="hud-n1"></div><div class="souls" id="hud-s1"></div></div>
    <div class="clock"><b>47</b><span><em class="won"></em><em></em> ROUND 2 <em class="won"></em><em></em></span></div>
    <div class="plate r"><div class="bar"><u style="width:51%"></u><i style="width:38%"></i></div><div class="nm" id="hud-n2"></div><div class="souls" id="hud-s2"></div></div>
  </div>
  <div class="hud-fx"><b>7</b> HITS<i>連撃</i></div>
</section>

<section data-screen="pause" class="screen pause">
  <div class="pause-box"><h2>PAUSE <i>一時停止</i></h2><nav class="list" id="pause-list"></nav></div>
</section>

<section data-screen="results" class="screen results">
  <div class="res-hero" id="res-hero"></div>
  <div class="res-card">
    <div class="res-win">WINNER <i>勝者</i></div>
    <div class="res-name" id="res-name"></div>
    <div class="res-quote" id="res-quote"></div>
    <table class="res-stats" id="res-stats"></table>
    <nav class="list row" id="res-list"></nav>
  </div>
</section>

<script type="module" src="ui.js"></script>
</body>
</html>
