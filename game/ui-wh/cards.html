<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>WESTERN HEART — Character Select</title>
<link rel="stylesheet" href="cards.css">
<script type="importmap">
{ "imports": {
  "three": "../vendor/three.module.js",
  "three/addons/": "../vendor/addons/"
} }
</script>
<style>
  /* standalone shell: full-viewport dark stage behind the select */
  html, body { width: 100%; height: 100%; margin: 0; overflow: hidden; background: #05020c; }
  body { font-family: "WHDisplay", Oswald, sans-serif; }
  @font-face { font-family: "WHDisplay"; src: url("fonts/Oswald-VariableFont_wght.ttf"); font-weight: 200 700; }
  #stage { position: fixed; inset: 0; background: url("art/wallpaper_wh.png") center/cover; filter: blur(6px) brightness(.45); }
  #select-root { z-index: 1; }
</style>
</head>
<body>
<div id="stage"></div>
<div id="select-root"></div>
<script type="module">
  import { initSelect } from "./cards.js";
  // Standalone QA mode: no game bridge. Confirm just shows the locked matchup.
  initSelect(document.getElementById("select-root"), {
    initial: { p1: "pantera", p2: "saku_ra" },
    onFight: (p1, p2, a1, a2) => {
      const el = document.getElementById("select-root");
      const b = document.createElement("div");
      b.className = "whsel-loading";
      b.innerHTML = `LOCKED IN — ${p1.toUpperCase()} (attire ${a1}) VS ${p2.toUpperCase()} (attire ${a2})`;
      el.appendChild(b);
      setTimeout(() => b.remove(), 2200);
    },
    onBack: () => history.back(),
  });
</script>
</body>
</html>
