# Netlify proxy rules (2026-10-24, menu path fix).
#
# The Netlify site publishes game/ as its root, but the Creation Suite
# lives outside game/ (customization/, packages/, and game/ refs) on the
# gh-pages layout, which GitHub Pages serves. These 200 proxy rewrites
# make those missing paths resolve on Netlify exactly as they do on
# GitHub Pages, so every menu link works identically on both hosts.
# force defaults to false: publish-dir files always win; only paths with
# no static file fall through to the proxy. No content link changes host.
[[redirects]]
  from = "/customization/*"
  to = "https://mhvnsnt.github.io/western-heart/customization/:splat"
  status = 200
[[redirects]]
  from = "/packages/*"
  to = "https://mhvnsnt.github.io/western-heart/packages/:splat"
  status = 200
[[redirects]]
  from = "/game/*"
  to = "https://mhvnsnt.github.io/western-heart/game/:splat"
  status = 200
