<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>Western Heart — SoftBody (Jolt PBD) test rig</title>
<!--
  DEV TOOL, not a game menu. Verifies game/js/softbody.js against a real
  fighter mesh: loads the model, builds the Jolt XPBD belly volume, steps
  it every frame, renders the deformed mesh + the sim particles.

  Usage: game/softbody-test.html?model=assets/models/pantera.glb&mesh=torso
  Buttons: Punch (inject a hit), quality Off/Low/High, particles on/off.
  Console prints a PROOF line per punch with dent depth + recovery.
-->
<style>
  html,body{margin:0;height:100%;overflow:hidden;background:#0b0d12;color:#dfe6f2;
    font-family:system-ui,-apple-system,sans-serif;touch-action:none}
  #c{position:fixed;inset:0;width:100%;height:100%;display:block}
  #hud{position:fixed;top:8px;left:8px;right:8px;pointer-events:none;font-size:13px}
  #hud .row{pointer-events:auto;display:flex;gap:8px;flex-wrap:wrap;align-items:center;
    background:rgba(10,14,22,.72);border:1px solid #2a3448;border-radius:10px;
    padding:8px 10px;margin-bottom:8px;backdrop-filter:blur(4px)}
  button{background:#1c2637;color:#e8eefb;border:1px solid #3a4a68;border-radius:8px;
    padding:10px 14px;font-size:14px;min-height:44px}
  button.on{background:#2e4d7d;border-color:#5b84c4}
  #stats{font-variant-numeric:tabular-nums;white-space:pre-wrap;line-height:1.5}
  #log{max-height:22vh;overflow-y:auto;font-size:12px;opacity:.9}
</style>
<script type="importmap">
{ "imports": {
    "three": "./vendor/three.module.js",
    "three/addons/": "./vendor/addons/"
} }
</script>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud">
  <div class="row">
    <button id="bPunch">👊 Punch belly</button>
    <button id="bQOff">Quality: Off</button>
    <button id="bQLow" class="on">Quality: Low</button>
    <button id="bQHigh">Quality: High</button>
    <button id="bPts" class="on">Particles</button>
  </div>
  <div class="row"><div id="stats">loading…</div></div>
  <div class="row"><div id="log"></div></div>
</div>
<script type="module">
import * as THREE from 'three';
import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';
import { SoftBody } from './js/softbody.js';

const qs = new URLSearchParams(location.search);
const MODEL = qs.get('model') || 'assets/models/pantera.glb';
const MESH_FILTER = (qs.get('mesh') || 'torso').toLowerCase();

const canvas = document.getElementById('c');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(devicePixelRatio, 2));
const scene = new THREE.Scene();
scene.background = new THREE.Color(0x0b0d12);
const camera = new THREE.PerspectiveCamera(40, 1, 0.05, 60);

// minimal drag-orbit (dev tool)
let theta = 0.5, phi = 1.15, dist = 2.2, tx = 0, ty = 1.15, tz = 0;
function applyCam() {
  camera.position.set(
    tx + dist * Math.sin(phi) * Math.sin(theta),
    ty + dist * Math.cos(phi),
    tz + dist * Math.sin(phi) * Math.cos(theta));
  camera.lookAt(tx, ty, tz);
}
let drag = null;
canvas.addEventListener('pointerdown', e => { drag = { x: e.clientX, y: e.clientY }; });
addEventListener('pointermove', e => {
  if (!drag) return;
  theta -= (e.clientX - drag.x) * 0.008;
  phi = Math.min(2.9, Math.max(0.2, phi - (e.clientY - drag.y) * 0.008));
  drag = { x: e.clientX, y: e.clientY }; applyCam();
});
addEventListener('pointerup', () => drag = null);
canvas.addEventListener('wheel', e => { dist = Math.min(8, Math.max(0.8, dist * (1 + e.deltaY * 0.001))); applyCam(); },
  { passive: true });
function resize() {
  renderer.setSize(innerWidth, innerHeight, false);
  camera.aspect = innerWidth / innerHeight; camera.updateProjectionMatrix();
}
addEventListener('resize', resize); resize(); applyCam();

scene.add(new THREE.HemisphereLight(0xbfd0ff, 0x30241a, 1.1));
const key = new THREE.DirectionalLight(0xffffff, 1.6); key.position.set(2, 3, 2); scene.add(key);

const statsEl = document.getElementById('stats');
const logEl = document.getElementById('log');
function log(msg) {
  console.log('[softbody-test]', msg);
  const d = document.createElement('div'); d.textContent = msg;
  logEl.prepend(d);
  while (logEl.children.length > 30) logEl.lastChild.remove();
}

const loader = new GLTFLoader();
loader.load(MODEL, (gltf) => {
  const meshes = [];
  gltf.scene.traverse(o => { if (o.isSkinnedMesh) meshes.push(o); });
  log(`model: ${MODEL} — ${meshes.length} skinned meshes`);
  let mesh = meshes.find(m => m.name.toLowerCase().includes(MESH_FILTER))
    || meshes.sort((a, b) => b.geometry.attributes.position.count - a.geometry.attributes.position.count)[0];
  log(`driving mesh: ${mesh.name} (${mesh.geometry.attributes.position.count} verts)`);
  mesh.frustumCulled = false;
  scene.add(mesh);

  const sb = SoftBody.fromMesh(mesh, SoftBody.anatomyFor({ jiggleFamily: 'female' }));
  log(`SoftBody: ${sb.particleCount} particles, ${sb.regionVertexCount} region verts, quality=${sb.quality}`);

  // particle cloud (yellow = dynamic, red = pinned)
  const H = sb._testHandle();
  let pts = null, ptsPos = null;
  function buildPoints() {
    if (pts) { scene.remove(pts); pts.geometry.dispose(); }
    const n = sb.particleCount;
    ptsPos = new Float32Array(n * 3);
    const col = new Float32Array(n * 3);
    const pinned = H.pinned() || [];
    for (let i = 0; i < n; i++) {
      if (pinned[i]) { col[i*3] = 1; col[i*3+1] = 0.25; col[i*3+2] = 0.25; }
      else { col[i*3] = 1; col[i*3+1] = 0.9; col[i*3+2] = 0.25; }
    }
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.BufferAttribute(ptsPos, 3));
    g.setAttribute('color', new THREE.BufferAttribute(col, 3));
    pts = new THREE.Points(g, new THREE.PointsMaterial({ size: 0.012, vertexColors: true }));
    pts.frustumCulled = false;
    pts.visible = document.getElementById('bPts').classList.contains('on');
    scene.add(pts);
  }

  const rest = () => H.restPositions();
  let punchT = -1, maxDent = 0;
  function punch() {
    const rc = sb._region.center, rr = sb._region.radius;
    const wp = new THREE.Vector3(rc[0], rc[1], rc[2] + rr[2] * 0.9);
    mesh.localToWorld(wp);
    sb.hit(wp, 1, 20);
    punchT = 0; maxDent = 0;
    log(`punch @ quality=${sb.quality}`);
  }
  document.getElementById('bPunch').onclick = punch;
  const qBtns = { off: 'bQOff', low: 'bQLow', high: 'bQHigh' };
  for (const [q, id] of Object.entries(qBtns)) {
    document.getElementById(id).onclick = () => {
      SoftBody.setGlobalQuality(q);
      for (const [q2, id2] of Object.entries(qBtns))
        document.getElementById(id2).classList.toggle('on', q2 === q);
      buildPoints();
      log(`quality -> ${q} (${sb.particleCount} particles)`);
    };
  }
  document.getElementById('bPts').onclick = (e) => {
    const on = e.target.classList.toggle('on');
    if (pts) pts.visible = on;
  };

  const clock = new THREE.Clock();
  let frames = 0, simMs = 0, lastFpsT = performance.now(), fps = 0;
  // wait for the body, then build the particle cloud
  const readyTimer = setInterval(() => {
    if (H.isReady()) { clearInterval(readyTimer); buildPoints(); log('Jolt body ready — sim live'); }
  }, 200);

  function frame() {
    requestAnimationFrame(frame);
    const dt = Math.min(clock.getDelta(), 0.05);
    const t0 = performance.now();
    sb.update(dt);
    simMs += performance.now() - t0;
    frames++;
    const now = performance.now();
    if (now - lastFpsT > 500) {
      fps = Math.round(frames * 1000 / (now - lastFpsT));
      const avgMs = simMs / Math.max(1, frames);
      frames = 0; lastFpsT = now;
      // measure current deformation
      let md = 0;
      const P = H.particlePositions(), R = rest();
      if (P && R) for (let i = 0; i < P.length; i++) md = Math.max(md, Math.abs(P[i] - R[i]));
      if (punchT >= 0) {
        punchT += 0.5; maxDent = Math.max(maxDent, md);
        if (punchT > 5) {
          log(`PROOF punch: max dent ${(maxDent*1000).toFixed(1)}mm, residual @5s ${(md*1000).toFixed(1)}mm`);
          console.log(`[softbody-test] PROOF dent_mm=${(maxDent*1000).toFixed(1)} residual_mm=${(md*1000).toFixed(1)}`);
          punchT = -1;
        }
      }
      // refresh particle cloud
      if (pts && pts.visible && P) {
        ptsPos.set(P);
        // sim is in mesh-local space; mesh is at scene root unrotated here
        pts.geometry.attributes.position.needsUpdate = true;
      }
      statsEl.textContent =
        `model ${MODEL}\n` +
        `fps ${fps} | softbody ${avgMs.toFixed(3)}ms/frame | quality ${sb.quality}\n` +
        `particles ${sb.particleCount} | region verts ${sb.regionVertexCount}\n` +
        `max particle disp ${(md*1000).toFixed(1)}mm` +
        (punchT >= 0 ? ` | punch t+${punchT.toFixed(1)}s dent ${(maxDent*1000).toFixed(1)}mm` : '');
      simMs = 0;
    }
    renderer.render(scene, camera);
  }
  frame();
}, undefined, (e) => { log('model load FAILED: ' + e.message); statsEl.textContent = 'load failed: ' + MODEL; });
</script>
</body>
</html>
