<!DOCTYPE html>
<html><head><meta charset="utf-8"><title>thumb load micro-test</title></head>
<body>
<script type="importmap">
{ "imports": { "three": "./vendor/three.module.js", "three/addons/": "./vendor/addons/" } }
</script>
<script type="module">
import { STAGES } from './js/stages.js';
const out = document.createElement('div');
out.id = 'grid';
document.body.appendChild(out);
for (const s of STAGES) {
  const img = document.createElement('img');
  img.src = s.thumb; img.width = 160; img.height = 90;
  out.appendChild(img);
}
window.__state = () => {
  const imgs = [...out.querySelectorAll('img')];
  return { total: imgs.length,
    complete: imgs.filter(i => i.complete).length,
    loaded: imgs.filter(i => i.complete && i.naturalWidth > 0).length,
    errored: imgs.filter(i => i.complete && i.naturalWidth === 0).length };
};
window.__ready = true;
</script>
</body></html>
