<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<title>Western Heart — UI Workshop</title>
<link rel="stylesheet" href="../tools/creation-suite/ui-kit/game-hud/dist/core.css">
<link rel="stylesheet" href="../tools/creation-suite/ui-kit/game-hud/dist/skins/fantasy.css">
<style>
  html, body { height: 100%; }
  body { display: flex; flex-direction: column; background: #141210; overflow: hidden; }
  header { display: flex; align-items: center; gap: 12px; padding: 10px 16px;
           background: #211d18; border-bottom: 2px solid var(--gold, #f2b01e); }
  header h1 { font-size: 16px; letter-spacing: .12em; color: var(--gold, #f2b01e); margin: 0; }
  header .sub { font-size: 12px; color: var(--text-dim, #b0a894); }
  header select { padding: 6px 10px; background: #2e2a26; color: #f7f2e7;
                  border: 1px solid var(--line, #8d867a); border-radius: 6px; }
  header .src { font-size: 11px; padding: 3px 10px; border-radius: 10px;
                background: #3a352f; color: #f7b731; }
  header .grow { flex: 1; }
  #export-btn { padding: 10px 20px; background: #2a6; color: #fff; border: none;
                border-radius: 8px; font-weight: 800; font-size: 14px; cursor: pointer; }
  #main { display: flex; flex: 1; min-height: 0; }
  #palette { width: 170px; flex: none; background: #1e1b17; padding: 12px;
             border-right: 1px solid #3a352f; overflow-y: auto; }
  #palette h3, #props h3 { font-size: 12px; letter-spacing: .1em; color: var(--gold, #f2b01e);
                           margin: 0 0 8px; }
  .pal-btn { display: block; width: 100%; margin: 4px 0; padding: 8px; text-align: left;
             background: #2e2a26; color: #f7f2e7; border: 1px solid #4a443c;
             border-radius: 6px; cursor: pointer; font-size: 12px; }
  .pal-btn:hover { border-color: var(--gold, #f2b01e); }
  #stage-wrap { flex: 1; display: flex; align-items: center; justify-content: center;
                background: #0d0c0a; min-width: 0; overflow: auto; padding: 16px; }
  #screen-canvas { box-shadow: 0 0 40px rgba(0,0,0,.8); transform-origin: center; }
  #screen-canvas .sel { outline: 2px dashed #4af !important; outline-offset: 2px; }
  #props { width: 260px; flex: none; background: #1e1b17; padding: 12px;
           border-left: 1px solid #3a352f; overflow-y: auto; }
  .prow { display: flex; align-items: center; gap: 6px; margin: 4px 0; }
  .prow label { width: 74px; flex: none; font-size: 11px; color: #b0a894; }
  .prow input, .prow select { flex: 1; min-width: 0; padding: 4px 6px; font-size: 12px;
    background: #2e2a26; color: #f7f2e7; border: 1px solid #4a443c; border-radius: 4px; }
  #props textarea { width: 100%; box-sizing: border-box; }
  #del-btn { width: 100%; margin-top: 8px; padding: 8px; background: transparent;
             color: #c66; border: 1px solid #844; border-radius: 6px; cursor: pointer; }
  #status { font-size: 11px; color: #8f8; margin-top: 8px; min-height: 16px; }
  .note { font-size: 11px; color: #8d867a; line-height: 1.4; margin: 8px 0; }
</style>
</head>
<body data-skin="fantasy">
<header>
  <h1>UI WORKSHOP</h1>
  <span class="sub">visual screen builder — drag, style, export</span>
  <select id="screen-sel"></select>
  <span class="src" id="src-badge"></span>
  <span class="grow"></span>
  <button id="export-btn">⬇ EXPORT SCREEN PATCH</button>
</header>
<div id="main">
  <aside id="palette">
    <h3>ADD ELEMENT</h3>
    <div id="pal-btns"></div>
    <div class="note">T8 is the starting template — your edits make it Western Heart.
      Sourcing: T8 UI first (t8-source/), then teardown layers, templates as fallback.</div>
  </aside>
  <div id="stage-wrap"><div id="screen-canvas"></div></div>
  <aside id="props">
    <h3>PROPERTIES</h3>
    <div id="prop-body"><div class="note">Click an element on the canvas to edit it.</div></div>
    <div id="status"></div>
  </aside>
</div>

<script type="module">
/* UI WORKSHOP — the game's visual screen builder (phase a: UI ART).
 * The user builds/edits screens by hand: drag-drop layout, styling, live
 * preview. Output goes through the SAME round-trip patch as everything else
 * (ui_screen_define). Phases b (flow) and c (wiring) plug into the screen's
 * reserved flow/wiring sections later.
 */
import { ELEMENT_TYPES, blankElement, emptyScreen, validateScreen,
         renderScreen, buildScreenPatch, downloadJson } from './js/ui-screen.js';

const $ = (id) => document.getElementById(id);
const errors = [];
addEventListener('error', (e) => errors.push(String(e.message || e.error)));

const KNOWN_SCREENS = [
  { id: 'stage-select', file: 'stage-select.t8-template.json', label: 'Stage Select (T8 template)' },
];
const MOCK_DATA = {
  stages: [
    { name: 'Shrine of Dawn', universe: 'Eastern Mind', swatch: ['#c8862a', '#6e4210'] },
    { name: 'Neon Dojo', universe: 'Western Heart', swatch: ['#2a6ec8', '#102a5e'] },
    { name: 'Iron Pagoda', universe: 'Eastern Mind', swatch: ['#888', '#333'] },
    { name: 'Dust Bowl', universe: 'Western Heart', swatch: ['#c8a02a', '#6e5a10'] },
    { name: 'Abyss Gate', universe: 'Eastern Mind', swatch: ['#6a2ac8', '#2a105e'] },
    { name: 'Rooftop Rain', universe: 'Western Heart', swatch: ['#2a88a0', '#103a44'] },
  ],
  fighters: [],
};

let screen = null;      // the working definition
let nodes = {};         // id -> DOM node
let selected = null;
let drag = null;

function fitScale() {
  const wrap = $('stage-wrap');
  const s = Math.min((wrap.clientWidth - 32) / 1280, (wrap.clientHeight - 32) / 720, 1);
  $('screen-canvas').style.transform = `scale(${s})`;
  return s;
}

function render() {
  nodes = renderScreen($('screen-canvas'), screen, MOCK_DATA, true, onPick);
  paintSel();
  $('src-badge').textContent = 'source: ' + (screen.source || '?');
  fitScale();
}

function paintSel() {
  for (const [id, n] of Object.entries(nodes)) n.classList.toggle('sel', id === selected);
}

function onPick(id, ev) {
  selected = id;
  paintSel();
  buildProps();
  // drag
  const e = screen.elements.find((x) => x.id === id);
  const scale = fitScale();
  const startX = ev.clientX, startY = ev.clientY, ox = e.x, oy = e.y;
  const move = (me) => {
    e.x = Math.round(ox + (me.clientX - startX) / scale);
    e.y = Math.round(oy + (me.clientY - startY) / scale);
    const n = nodes[id];
    if (n) { n.style.left = e.x + 'px'; n.style.top = e.y + 'px'; }
    syncPropInputs();
  };
  const up = () => { removeEventListener('pointermove', move); removeEventListener('pointerup', up); };
  addEventListener('pointermove', move);
  addEventListener('pointerup', up);
  drag = { move, up };
}

$('screen-canvas').addEventListener('pointerdown', (ev) => {
  if (ev.target === $('screen-canvas')) { selected = null; paintSel(); buildProps(); }
});

function numRow(body, label, obj, key, min, max, step) {
  const row = document.createElement('div'); row.className = 'prow';
  row.innerHTML = `<label>${label}</label>`;
  const inp = document.createElement('input');
  inp.type = 'number'; inp.min = min; inp.max = max; inp.step = step;
  inp.value = obj[key] ?? 0; inp.dataset.pk = key;
  inp.addEventListener('input', () => {
    obj[key] = parseFloat(inp.value) || 0;
    const n = nodes[obj.id];
    if (n && (key === 'x' || key === 'y')) { n.style.left = obj.x + 'px'; n.style.top = obj.y + 'px'; }
    if (n && (key === 'w' || key === 'h')) { n.style.width = obj.w + 'px'; n.style.height = obj.h + 'px'; }
  });
  row.appendChild(inp);
  body.appendChild(row);
  return inp;
}
function textRow(body, label, obj, key, isColor) {
  const row = document.createElement('div'); row.className = 'prow';
  row.innerHTML = `<label>${label}</label>`;
  const inp = document.createElement('input');
  inp.type = isColor ? 'color' : 'text';
  let v = obj[key] ?? '';
  if (isColor && !/^#[0-9a-fA-F]{6}$/.test(v)) v = '#ffffff';
  inp.value = v; inp.dataset.pk = key;
  inp.addEventListener('input', () => { obj[key] = inp.value; render(); paintSel(); });
  row.appendChild(inp);
  body.appendChild(row);
}
function syncPropInputs() {
  const e = screen?.elements.find((x) => x.id === selected);
  if (!e) return;
  document.querySelectorAll('#prop-body [data-pk]').forEach((inp) => {
    const k = inp.dataset.pk;
    if (e[k] !== undefined && document.activeElement !== inp) inp.value = e[k];
    const sk = k.startsWith('s_') ? k.slice(2) : null;
    if (sk && e.style && e.style[sk] !== undefined && document.activeElement !== inp) inp.value = e.style[sk];
  });
}

function buildProps() {
  const body = $('prop-body'); body.innerHTML = '';
  const e = screen.elements.find((x) => x.id === selected);
  if (!e) { body.innerHTML = '<div class="note">Click an element on the canvas to edit it.</div>'; return; }
  body.appendChild(Object.assign(document.createElement('div'),
    { innerHTML: `<b style="color:#f2b01e">${e.type}</b> <span style="color:#8d867a">${e.id}</span>` }));
  textRow(body, 'id', e, 'id');
  numRow(body, 'x', e, 'x', -200, 1600, 1);
  numRow(body, 'y', e, 'y', -200, 1200, 1);
  numRow(body, 'w', e, 'w', 8, 1600, 1);
  numRow(body, 'h', e, 'h', 8, 1200, 1);
  if (['label', 'button'].includes(e.type)) textRow(body, 'text', e, 'text');
  if (e.type === 'image') textRow(body, 'src', e, 'src');
  if (e.type === 'card-grid') {
    textRow(body, 'bind', e, 'bind');
    numRow(body, 'card w', e, 'cardW', 40, 600, 1);
    numRow(body, 'card h', e, 'cardH', 40, 600, 1);
    numRow(body, 'gap', e, 'gap', 0, 60, 1);
  }
  const st = e.style ||= {};
  const srow = (label, key, isColor, min, max, step) => {
    const row = document.createElement('div'); row.className = 'prow';
    row.innerHTML = `<label>${label}</label>`;
    const inp = document.createElement('input');
    if (isColor) {
      inp.type = 'color';
      let v = st[key] || '#ffffff';
      if (!/^#[0-9a-fA-F]{6}$/.test(v)) v = '#ffffff';
      inp.value = v;
    } else { inp.type = 'number'; inp.min = min; inp.max = max; inp.step = step; inp.value = st[key] ?? 0; }
    inp.dataset.pk = 's_' + key;
    inp.addEventListener('input', () => {
      st[key] = isColor ? inp.value : (parseFloat(inp.value) || 0);
      render(); paintSel();
    });
    row.appendChild(inp); body.appendChild(row);
  };
  srow('font size', 'fontSize', false, 8, 120, 1);
  srow('color', 'color', true);
  srow('bg', 'background', true);
  srow('border w', 'borderWidth', false, 0, 12, 1);
  srow('border col', 'borderColor', true);
  srow('radius', 'radius', false, 0, 60, 1);
  srow('weight', 'fontWeight', false, 100, 900, 100);
  const alignRow = document.createElement('div'); alignRow.className = 'prow';
  alignRow.innerHTML = '<label>align</label>';
  const sel = document.createElement('select'); sel.dataset.pk = 's_align';
  for (const a of ['left', 'center', 'right']) {
    const o = document.createElement('option'); o.value = a; o.textContent = a;
    if (st.align === a) o.selected = true;
    sel.appendChild(o);
  }
  sel.addEventListener('change', () => { st.align = sel.value; render(); paintSel(); });
  alignRow.appendChild(sel); body.appendChild(alignRow);

  const del = document.createElement('button');
  del.id = 'del-btn'; del.textContent = 'delete element';
  del.addEventListener('click', () => {
    screen.elements = screen.elements.filter((x) => x.id !== e.id);
    selected = null; render(); buildProps();
  });
  body.appendChild(del);
}

function buildPalette() {
  const wrap = $('pal-btns'); wrap.innerHTML = '';
  for (const t of ['label', 'button', 'panel', 'image', 'card-grid']) {
    const b = document.createElement('button');
    b.className = 'pal-btn'; b.textContent = '+ ' + t;
    b.addEventListener('click', () => {
      const e = blankElement(t);
      e.id = t + '_' + (screen.elements.length + 1);
      screen.elements.push(e);
      selected = e.id;
      render(); buildProps();
    });
    wrap.appendChild(b);
  }
}

async function loadScreen(file) {
  const def = await (await fetch(`../customization/ui-screens/${file}`)).json();
  if (!def || def.format !== 'wh-ui-screen') throw new Error(`bad screen file ${file}`);
  screen = def;
  selected = null;
  render(); buildProps();
  $('status').textContent = `loaded ${def.name} (${def.elements.length} elements)`;
}

function buildScreenPicker() {
  const sel = $('screen-sel');
  for (const s of KNOWN_SCREENS) {
    const o = document.createElement('option');
    o.value = s.file; o.textContent = s.label;
    sel.appendChild(o);
  }
  sel.addEventListener('change', () => loadScreen(sel.value).catch((e) => {
    $('status').textContent = 'LOAD FAILED: ' + (e.message || e);
  }));
}

$('export-btn').addEventListener('click', () => {
  try {
    const patch = buildScreenPatch(screen, '');
    downloadJson(`${screen.id}-screen-patch.json`, patch);
    $('status').textContent =
      `exported ${screen.id}-screen-patch.json (${screen.elements.length} elements) — send it back in chat`;
    console.log('[UI-WORKSHOP] exported patch', patch);
  } catch (e) {
    $('status').textContent = 'EXPORT FAILED: ' + (e.message || e);
  }
});

addEventListener('resize', fitScale);

window.__uiworkshop = {
  errors,
  get screen() { return screen; },
  render, validate: () => validateScreen(screen),
  patch: (notes) => buildScreenPatch(screen, notes || ''),
};

(async function boot() {
  try {
    buildPalette();
    buildScreenPicker();
    await loadScreen(KNOWN_SCREENS[0].file);
    window.__ready = true;
    console.log('[UI-WORKSHOP] ready');
  } catch (e) {
    $('status').textContent = 'BOOT FAILED: ' + (e.message || e);
    console.error('[UI-WORKSHOP] boot failed', e);
  }
})();
</script>
</body>
</html>
